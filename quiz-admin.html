    const head = `<div class="statbar"><div class="bar" style="margin:0">${pb.html}<span style="flex:1"></span><div class="seg" role="group" aria-label="Visualização"><button data-v="fluxo" aria-pressed="${this.view === "fluxo"}">No mapa</button><button data-v="funil" aria-pressed="${this.view === "funil"}">Funil</button><button data-v="ab" aria-pressed="${this.view === "ab"}">Testes A/B</button></div></div>

      $$("[data-n]", host).forEach(r => { const g = () => { TABS.clientes.filter = r.dataset.n; go(`p/${p.id}/clientes`); }; r.onclick = g; r.onkeydown = e => { if (e.key === "Enter") g(); }; });

      host.innerHTML = head + `<main class="wrap">${abs.length ? abs.map(n => { const pr = n.data.props; const vers = n.data.kind === "ab" ? [["A", pr.nomeA || "A"], ["B", pr.nomeB || "B"]] : (pr.caminhos || []).map(c => [c.id, c.nome]); const row = ([k, nome]) => { const g = L.filter(l => (l.ab || {})[n.id] === k), f = g.filter(l => l.finalizado).length, c = g.filter(l => l.whatsapp).length; return `<tr><td><b>${esc(nome)}</b></td><td>${g.length}</td><td>${c} (${g.length ? Math.round(c / g.length * 100) : 0}%)</td><td>${f} (${g.length ? Math.round(f / g.length * 100) : 0}%)</td></tr>`; }; return `<div class="card" style="margin-bottom:12px"><h3>${n.data.kind === "ab" ? `Teste A/B · ${+pr.pctA}% / ${100 - +pr.pctA}%` : "Divisão de tráfego · " + vers.length + " caminhos"}</h3><p class="sub">Cada cliente fica sempre na mesma versão.</p><table class="tbl" style="width:100%"><thead><tr><th>Versão</th><th>Entraram</th><th>Deixaram contato</th><th>Finalizaram</th></tr></thead><tbody>${vers.map(row).join("")}</tbody></table></div>`; }).join("") : `<div class="empty">Nenhum teste no mapa. Adicione em Fluxo → Nova função → Teste A/B ou Divisão de tráfego.</div>`}</main>`;
    }
    pb.bind(host); $$("[data-v]", host).forEach(b => b.onclick = () => { this.view = b.dataset.v; this.draw(); });

      ${cartLink ? `<div class="sec">Carrinho montado</div><a href="${esc(cartLink)}" target="_blank" rel="noopener" style="font-size:12px;word-break:break-all">${l.carrinho.length} peça(s)${l.cupom ? " · cupom " + esc(l.cupom) : ""} — abrir na Yampi ↗</a><div class="row" style="margin-top:6px"><button class="btn xs sec" data-cc="${esc(cartLink)}">Copiar link do carrinho</button></div>` : ""}
      <div class="sec">Dados</div><dl class="kv"><dt>Entrou</dt><dd>${fmtDT(l.criadoEm)}</dd><dt>Última ação</dt><dd>${fmtDT(l.atualizadoEm)}</dd><dt>Origem</dt><dd>${esc(orig)}</dd>${l.statusPor ? `<dt>Status por</dt><dd>${esc(l.statusPor)} · ${fmtDT(l.statusEm)}</dd>` : ""}</dl>
      <div class="sec">Caminho no quiz</div><div class="muted" style="font-size:12px">${(l.vistas || []).map(id => esc(nodeLabel(id))).filter(x => x !== "—").join(" → ")}</div>
      <div class="sec">Anotações</div><textarea class="inp" id="dn" placeholder="Ex.: pediu para chamar amanhã">${esc(l.notas || "")}</textarea>
      <div class="row" style="justify-content:space-between;margin-top:8px">${me.gestor ? `<button class="btn sm ghost danger" id="ddel">Excluir cliente</button>` : "<span></span>"}<button class="btn sm primary" id="dsv">Salvar anotação</button></div></div>`;
    document.body.appendChild(d);
    const close = () => { d.remove(); document.removeEventListener("keydown", k); this.draw(); };
    const k = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", k);
    d.addEventListener("mousedown", e => { if (e.target === d) close(); });
    $("[data-x]", d).onclick = close; $("[data-x]", d).focus();
    $("#dst", d).onchange = e => setStatus(l.id, e.target.value);
    if ($("#dwa", d)) $("#dwa", d).onclick = () => { if ((l.status || "novo") === "novo") setStatus(l.id, "contato"); };
    $$("[data-cc]", d).forEach(b => b.onclick = () => { navigator.clipboard.writeText(b.dataset.cc); toast("Link copiado"); });
    $("#dsv", d).onclick = async () => { try { await DB.leads().doc(l.id).update({ notas: $("#dn", d).value.slice(0, 2000) }); toast("Anotação salva"); } catch (e) { toast("Erro: " + e.message); } };
    if ($("#ddel", d)) $("#ddel", d).onclick = async () => { if (!await confirmBox("Excluir cliente", "Excluir este contato e as respostas dele?", "Excluir", true)) return; await DB.leads().doc(l.id).delete(); close(); toast("Excluído"); };
  },
};
function waText(l) {
  const m = ST.project.config.mensagensCRM || {};
  let t = m.parou;
  if (l.finalizado) t = l.destino === "whatsapp" ? m.whatsapp : m.site;
  else if ((l.carrinho || []).length) t = m.carrinho;
  else if (!lastPage(l) || (l.vistas || []).length <= 3) t = m.inicio;
  const vars = Object.assign({}, l.vars || {}, { nome: l.nome, primeiroNome: U.first(l.nome), etapa: stageText(l), escolhas: (l.escolhas || []).join(" · ") });
  return U.interp(t || "Oi {{primeiroNome}}!", vars);
}
function waLead(l) { let d = U.digits(l.whatsapp); if (d.length <= 11) d = "55" + d; return `https://wa.me/${d}?text=${encodeURIComponent(waText(l))}`; }
async function setStatus(id, status) { try { await DB.leads().doc(id).update({ status, statusEm: U.now(), statusPor: me.name }); } catch (e) { toast("Erro: " + e.message); } }

// ---------- CONFIGURAÇÕES ----------
const CONFIG_SCHEMA = [
  { key: "whatsRevenda", label: "WhatsApp revenda (com DDD)", type: "text" }, { key: "whatsVarejo", label: "WhatsApp varejo (com DDD)", type: "text" },
  { key: "lojaUrl", label: "Site da loja", type: "text" }, { key: "carrinhoBase", label: "Link base do carrinho Yampi", type: "text" },
  { key: "pixelId", label: "Pixel da Meta (ID)", type: "text" }, { key: "gtmId", label: "Google Tag Manager (GTM-XXXX)", type: "text" },
  { key: "tituloSite", label: "Título da página (aparece na aba e no compartilhamento)", type: "text" }, { key: "descricaoSite", label: "Descrição", type: "textarea" },
  { key: "imagemSite", label: "Imagem de compartilhamento", type: "image" },
  { key: "robos", label: "Permitir aparecer no Google", type: "toggle" },
  { key: "headerScript", label: "Script no cabeçalho (avançado)", type: "code" },
];
const MSG_SCHEMA = [
  { key: "inicio", label: "Parou logo no começo", type: "textarea" }, { key: "parou", label: "Parou no meio ({{etapa}} = onde parou)", type: "textarea" },
  { key: "carrinho", label: "Montou carrinho e não finalizou ({{escolhas}})", type: "textarea" }, { key: "site", label: "Foi para o carrinho/site", type: "textarea" }, { key: "whatsapp", label: "Foi para o WhatsApp", type: "textarea" },
];
TABS.config = {
  render(host) {
    const p = ST.project;
    host.innerHTML = `<main class="wrap"><div class="stack" style="max-width:820px">
      <div class="card"><h3>Básico</h3><p class="sub">Nome interno e endereço público.</p><label class="fld"><span class="lbl">Nome do quiz</span><input class="inp" id="cn" value="${esc(p.nome)}" maxlength="80"></label><label class="fld"><span class="lbl">Endereço</span><div class="row"><span class="muted" style="font-size:12px;white-space:nowrap">…/q.html?p=</span><input class="inp" id="cs" value="${esc(p.slug || "")}" maxlength="40" autocapitalize="off" spellcheck="false"></div><span class="hint" id="csh">Letras minúsculas, números e hífen. Ao mudar, publique de novo.</span></label></div>
      <div class="card"><h3>Integrações e página</h3><p class="sub">Pixel, WhatsApp, Yampi e SEO.</p><div id="cf1"></div></div>
      <div class="card"><h3>Mensagens do CRM</h3><p class="sub">Texto do botão WhatsApp na aba Clientes, conforme onde a cliente parou. Use {{primeiroNome}}, {{etapa}}, {{escolhas}} ou qualquer variável.</p><div id="cf2"></div></div>
      ${me.gestor ? `<div class="card danger"><h3>Zona de perigo</h3><p class="sub">Excluir o quiz tira o link do ar. Os contatos ficam guardados.</p><button class="btn danger fill" id="cdel">Excluir quiz</button></div>` : ""}</div></main>`;
    $("#cn").oninput = e => { p.nome = e.target.value; markDirty(); };
    $("#cs").onblur = e => { const s = slugify(e.target.value); if (s !== e.target.value) { e.target.value = s; p.slug = s; markDirty(); } };
    $("#cs").oninput = async e => { const s = slugTyping(e.target.value); if (s !== e.target.value) e.target.value = s; p.slug = s; markDirty(); clearTimeout(e.target._t); e.target._t = setTimeout(async () => { const ok = s.length >= 3 && await DB.slugFree(s, p.id); $("#csh").textContent = ok ? "Endereço disponível ✓" : "Esse endereço já está em uso ou é curto demais"; $("#csh").style.color = ok ? "var(--success)" : "var(--danger)"; }, 400); };
    const f1 = () => buildForm($("#cf1"), CONFIG_SCHEMA, p.config, rer => { markDirty(); if (rer) f1(); });
    const f2 = () => buildForm($("#cf2"), MSG_SCHEMA, p.config.mensagensCRM, rer => { markDirty(); if (rer) f2(); });
    f1(); f2();
    if ($("#cdel")) $("#cdel").onclick = async () => { if (await deleteProject(p)) go(""); };
  },
};

</script>
