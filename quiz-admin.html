<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Veraneio — Painel</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0E1015;--surface:#151920;--surface-2:#1C2129;--surface-3:#242A34;--border:#262C36;--border-input:#6B7485;--text:#ECEEF2;--text-muted:#9CA5B4;--accent:#E0B868;--accent-deco:#C9A15B;--on-accent:#1A1307;--danger:#F08A80;--success:#62C994;--info:#7FB2F0;--warn:#E9B45B;--whatsapp:#1F9D55;--canvas:#0B0D11;--node:#161A21;--font-display:'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, sans-serif;--font-sans:'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, sans-serif;--font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;--font-brand:'Cormorant Garamond', Georgia, serif;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;--sh-card:0 1px 2px rgba(0,0,0,.25);--sh-pop:0 18px 48px rgba(0,0,0,.45);}:root[data-theme="light"]{color-scheme:light;--bg:#F5F6F8;--surface:#FFFFFF;--surface-2:#F0F2F5;--surface-3:#E7EAEF;--border:#E1E5EA;--border-input:#7E8899;--text:#14171C;--text-muted:#586171;--accent:#8A6A3B;--accent-deco:#A27B43;--on-accent:#FFFFFF;--danger:#B3261E;--success:#2E6F4F;--info:#1F5BA8;--warn:#8A5A10;--whatsapp:#147A3F;--canvas:#ECEEF2;--node:#FFFFFF;--sh-card:0 1px 2px rgba(20,23,28,.06);--sh-pop:0 18px 48px rgba(20,23,28,.18);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.muted{color:var(--text-muted)}
.mono{font-family:var(--font-mono);font-size:12px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
/* ---------- primitivos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:13px;letter-spacing:.005em;cursor:pointer;white-space:nowrap;text-decoration:none;background:transparent;color:var(--text);transition:background .12s,border-color .12s,filter .12s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);border-color:var(--border)}
.btn.sec:hover{border-color:var(--border-input);background:var(--surface-3)}
.btn.ghost{color:var(--text-muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn.danger.fill{background:var(--danger);color:var(--bg)}
.btn.wa{background:var(--whatsapp);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.icon{width:36px;padding:0}
.btn.icon.sm{width:30px}
.inp{width:100%;min-height:36px;border:1px solid var(--border);background:var(--bg);border-radius:var(--r-sm);padding:7px 10px;outline:none;transition:border-color .12s,box-shadow .12s}
.inp:hover{border-color:var(--border-input)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.inp::placeholder{color:color-mix(in srgb,var(--text-muted) 70%,transparent)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
textarea.code{font-family:var(--font-mono);font-size:12px;min-height:110px}
select.inp{padding-right:28px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.fld>label,.fld>.lbl{font-size:11.5px;font-weight:600;color:var(--text-muted);letter-spacing:.01em}
.fld .hint{font-size:11px;color:var(--text-muted)}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-muted);line-height:1.6}
.pill.ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.pill.tag{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.new-tag{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:4px;padding:1px 5px}
.toggle{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{width:34px;height:20px;border-radius:20px;background:var(--surface-3);border:1px solid var(--border-input);position:relative;transition:background .15s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-muted);transition:left .15s,background .15s}
.toggle input:checked+.sw{background:var(--accent);border-color:var(--accent)}
.toggle input:checked+.sw::after{left:16px;background:var(--on-accent)}
.toggle input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px 20px}
.card h3{font-size:15px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
.card .sub{color:var(--text-muted);font-size:12.5px;margin:0 0 16px}
.card.danger{border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-3);color:var(--text);border:1px solid var(--border-input);padding:10px 16px;border-radius:10px;z-index:200;font-size:13px;font-weight:500;box-shadow:var(--sh-pop)}
.modal-bg{position:fixed;inset:0;background:rgba(5,6,9,.6);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-pop);width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column}
.modal.wide{max-width:900px}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal header h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.modal .body{padding:16px 18px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.empty{color:var(--text-muted);text-align:center;padding:36px 12px}
.spin{width:22px;height:22px;border:3px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r-md)}
@keyframes sk{to{background-position:-200% 0}}
/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--accent) 10%,transparent),transparent)}
.lbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:30px 26px;width:100%;max-width:380px;box-shadow:var(--sh-pop)}
.wordmark{font-family:var(--font-brand);font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.lbox h1{font-size:28px;text-align:center;margin:0}
.lbox p{text-align:center;color:var(--text-muted);margin:6px 0 20px;font-size:13px}
.users{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ubtn{border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-sm);padding:11px 8px;cursor:pointer;font-weight:600;text-transform:capitalize}
.ubtn:hover{border-color:var(--border-input)}
.ubtn[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface-2));color:var(--accent)}
.lmsg{color:var(--danger);font-size:13px;text-align:center;margin-top:10px;min-height:18px}
/* ---------- topo ---------- */
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top .brand{font-size:17px;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:10px}
.top .brand small{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.08em;color:var(--on-accent);background:var(--accent);font-weight:700;border-radius:5px;padding:2px 6px;text-transform:uppercase}
.top .back{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;color:var(--text-muted);text-decoration:none}
.top .back:hover{background:var(--surface-2);color:var(--text)}
.top .pname{font-weight:700;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--text-muted);font-weight:600;white-space:nowrap;text-decoration:none;font-size:13px}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab[aria-current=page]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.top .sp{flex:1}
.savest{font-size:12px;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.savest i{width:7px;height:7px;border-radius:50%;background:var(--success)}
.savest.dirty i{background:var(--warn)}.savest.err i{background:var(--danger)}
main.wrap{padding:24px;max-width:1280px;margin:0 auto}
/* ---------- projetos ---------- */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.025em}
.folders{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-muted)}
.chip:hover{color:var(--text)}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;min-height:156px;transition:border-color .12s,transform .12s}
.pcard:hover{border-color:var(--border-input);transform:translateY(-1px)}
.pcard h4{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard .meta{font-size:12px;color:var(--text-muted);margin-top:auto;display:flex;justify-content:space-between;gap:8px}
.pcard .menu-btn{position:absolute;top:10px;right:10px}
.pcard.new{border-style:dashed;align-items:center;justify-content:center;color:var(--accent);font-weight:600;background:transparent}
.menu{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:var(--sh-pop);padding:4px;min-width:200px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:13px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl button{border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-md);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tpl button:hover{border-color:var(--border-input)}
.tpl button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface-2))}
.tpl button small{color:var(--text-muted)}
/* ---------- canvas (mapa) ---------- */
.cv{position:relative;height:calc(100vh - 56px);overflow:hidden;background:var(--canvas);background-image:radial-gradient(circle,color-mix(in srgb,var(--text-muted) 18%,transparent) 1px,transparent 1.3px);background-size:24px 24px;cursor:grab;touch-action:none;user-select:none}
.cv.panning{cursor:grabbing}
.cv-layer{position:absolute;left:0;top:0;transform-origin:0 0}
.cv svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.cv svg.edges path{fill:none;stroke:color-mix(in srgb,var(--accent-deco) 75%,var(--text-muted));stroke-width:1.8;pointer-events:stroke;cursor:pointer}
.cv svg.edges path.hit{stroke:transparent;stroke-width:14}
.cv svg.edges path.hit:hover+path,.cv svg.edges path.sel{stroke:var(--danger);stroke-width:2.6}
.cv svg.edges path.tmp{stroke-dasharray:6 5;stroke:var(--accent)}
.node{position:absolute;width:250px;background:var(--node);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:default}
.node:hover{border-color:var(--border-input)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent),0 8px 24px rgba(0,0,0,.28)}
.node.drop{border-color:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 25%,transparent)}
.node .nh{display:flex;align-items:center;gap:9px;padding:10px 10px 9px;cursor:move;font-weight:700;font-size:13px;letter-spacing:-.005em}
.node .chipi{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent))}
.node .nh .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .nh .acts{display:none;gap:1px}
.node:hover .nh .acts,.node.sel .nh .acts{display:flex}
.node .nh .acts button{width:24px;height:24px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center}
.node .nh .acts button:hover{background:var(--surface-3);color:var(--text)}
.node .nb{padding:2px 10px 8px;font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px}
.node .nb .bl{display:flex;align-items:center;gap:7px;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2);border-radius:7px}
.node .nb .bl .ic{width:14px;height:14px;flex:none;opacity:.8}
.node .nb .sum{padding:2px 2px 0;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.node .thumbs-n{display:flex;gap:4px;padding:0 10px 8px}
.node .thumbs-n span{width:44px;height:44px;border-radius:8px;background:var(--surface-3) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.node .outs{border-top:1px solid var(--border);padding:5px 0}
.node .out{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:4px 18px 4px 10px;font-size:12px;color:var(--text);min-height:26px}
.node .out span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .dot{position:absolute;right:-7px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--node);border:2px solid var(--accent-deco);cursor:crosshair;transition:transform .1s}
.node .dot.on{background:var(--accent-deco)}
.node .dot:hover{transform:scale(1.3)}
.node .in{position:absolute;left:-6px;top:18px;width:11px;height:11px;border-radius:50%;background:var(--accent-deco);border:2px solid var(--canvas)}
.node.start{width:160px;background:color-mix(in srgb,var(--accent) 14%,var(--node));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.node.start .nh{color:var(--accent)}
.node.start .outs{border:0}
.node .warn{color:var(--warn);font-size:11px;padding:5px 10px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:center}
.node .stat{position:absolute;top:-30px;left:0;display:flex;gap:4px}
.node .stat span{background:var(--surface-3);color:var(--text);font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600;border:1px solid var(--border)}
.node .stat span.r{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cv-tools{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.cv-tools .btn{justify-content:flex-start;min-width:150px;box-shadow:var(--sh-card)}
.cv-zoom{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:5}
.cv-zoom .btn{border-radius:0;height:36px;width:36px}
.cv-zoom .btn+.btn{border-top:1px solid var(--border)}
.cv-right{position:absolute;right:14px;top:14px;z-index:5;display:flex;gap:6px;align-items:center}
.cv-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-muted);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border);padding:5px 12px;border-radius:999px;z-index:5;white-space:nowrap}
/* painel de escolha (nova página / nova função) */
.picker{position:absolute;left:180px;top:14px;z-index:30;width:min(760px,calc(100% - 200px));max-height:calc(100% - 28px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-pop);padding:16px}
.picker>header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.picker>header h3{margin:0;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.picker .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-items:start}
.picker .grp{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px}
.picker .grp h5,.ped .lib h5{margin:2px 4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:700}
.picker .opt{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:var(--surface);border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left;margin-bottom:5px}
.picker .opt:last-child{margin-bottom:0}
.picker .opt:hover{border-color:var(--border-input)}
.picker .opt .t{flex:1;min-width:0}
.picker .opt .t b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.picker .opt .t small{display:block;color:var(--text-muted);font-size:11.5px;line-height:1.35;margin-top:1px}
.picker .opt .chipi{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent))}
/* ---------- editor de página ---------- */
.ped{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;grid-template-rows:56px 1fr;grid-template-columns:300px 1fr 360px}
.ped>header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.ped>header .inp{max-width:280px;min-width:120px;flex:1;font-weight:700}
.ped .lib{border-right:1px solid var(--border);overflow:auto;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.ped .lib .grp{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:8px}
.ped .lib .items{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ped .lib button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--surface);border-radius:8px;padding:8px;cursor:pointer;font-size:12px;font-weight:500;text-align:left;min-width:0}
.ped .lib button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped .lib button:hover{border-color:var(--border-input)}
.ped .lib button .ic{color:var(--accent);flex:none}
.ped .lib button.novo{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.ped .lib button.novo::after{content:"✦";margin-left:auto;color:var(--accent);font-size:11px}
.ped .stage{overflow:auto;display:flex;justify-content:center;padding:28px 16px;background:var(--canvas);background-image:radial-gradient(circle,color-mix(in srgb,var(--text-muted) 14%,transparent) 1px,transparent 1.3px);background-size:24px 24px}
.phone{width:390px;min-height:700px;border-radius:34px;box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);overflow:hidden;align-self:flex-start;border:10px solid #050608;background:#050608}
.phone .q-frame{min-height:680px;border-radius:24px;overflow:hidden}
.ped .blk{position:relative;cursor:pointer;border-radius:8px;outline:1.5px dashed transparent;outline-offset:4px}
.ped .blk:hover{outline-color:color-mix(in srgb,#C9A15B 55%,transparent)}
.ped .blk.sel{outline:2px solid #C9A15B}
.ped .blk .bt{position:absolute;right:-4px;top:-36px;display:none;gap:2px;background:#11141A;border-radius:8px;padding:3px;z-index:6;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.ped .blk.sel .bt{display:flex}
.ped .blk .bt button{width:26px;height:26px;border:0;background:transparent;color:#ECEEF2;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ped .blk .bt button:hover{background:rgba(255,255,255,.12)}
.ped .blk .bt .lb{color:#ECEEF2;font:600 11px var(--font-sans);padding:0 6px;display:flex;align-items:center}
.ped .blk *{pointer-events:none}
.ped .blk .bt,.ped .blk .bt *{pointer-events:auto}
.ped .insp{border-left:1px solid var(--border);overflow:auto;padding:16px;background:var(--surface)}
.ped .insp h4{margin:0 0 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.ped .insp h4 .ic{color:var(--accent)}
.items-ed{display:flex;flex-direction:column;gap:6px}
.items-ed .it{border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2)}
.items-ed .it>summary{list-style:none;display:flex;align-items:center;gap:6px;padding:7px 8px;cursor:pointer;font-size:13px}
.items-ed .it>summary::-webkit-details-marker{display:none}
.items-ed .it>summary .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items-ed .it>div{padding:10px 10px 2px;border-top:1px solid var(--border)}
.imgf{display:flex;gap:8px;align-items:flex-start}
.imgf .th{width:52px;height:52px;border-radius:9px;background:var(--surface-3) center/cover no-repeat;flex:none;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.imgf .col{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.icongrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.icongrid button{height:32px;border:1px solid var(--border);background:var(--surface-2);border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.icongrid button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface-2))}
.colorf{display:flex;gap:6px;align-items:center}
.colorf input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--border);border-radius:7px;background:var(--bg);cursor:pointer}
.condg{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;margin-bottom:10px;background:var(--surface-2)}
.condr{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:4px;margin-bottom:4px}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;margin-bottom:12px}
.warnbox code{font-family:var(--font-mono);font-size:11.5px}
/* prévia (testar) */
.pv{display:grid;grid-template-columns:auto 300px;gap:18px;align-items:start}
.pv .phone{min-height:640px}
.pv .q-frame{min-height:620px;max-height:72vh;overflow:auto}
.pv .dbg{font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;max-height:72vh;overflow:auto}
.pv .dbg pre{white-space:pre-wrap;word-break:break-all;margin:4px 0 10px;font-family:var(--font-mono);font-size:11px;color:var(--text)}
/* ---------- abas ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px}
.kpi .l{color:var(--text-muted);font-size:12px;font-weight:600}
.kpi .v{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--text-muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--text-muted);font-size:12.5px;font-weight:600;border-radius:7px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.statbar{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.statbar .nums{display:flex;gap:26px;margin-top:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-muted)}
.statbar .nums b{display:block;font-size:20px;color:var(--text);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fn-row{display:grid;grid-template-columns:200px 1fr 140px;gap:12px;align-items:center;padding:6px 8px;border-radius:8px}
.fn-row.click{cursor:pointer}.fn-row.click:hover{background:var(--surface-2)}
.fn-row .trk{height:26px;background:var(--surface-2);border-radius:6px;overflow:hidden;position:relative}
.fn-row .trk i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deco),var(--accent));border-radius:6px}
.fn-row .trk b{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
.fn-row .r{font-size:12px;text-align:right;color:var(--text-muted);font-variant-numeric:tabular-nums}
.fn-row .r .d{color:var(--danger)}
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);max-height:calc(100vh - 260px)}
table.tbl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;max-width:260px}
.tbl th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:11.5px;color:var(--text-muted);z-index:1;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tbl td{overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:var(--surface-2)}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;min-height:340px;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.col h4{margin:2px 4px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
.col h4 span{background:var(--surface-3);border-radius:999px;padding:0 8px;color:var(--text);font-variant-numeric:tabular-nums}
.col[data-st=novo] h4{color:var(--info)}.col[data-st=contato] h4{color:var(--warn)}.col[data-st=comprou] h4{color:var(--success)}
.lc{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.lc:hover{border-color:var(--border-input)}
.lc .nm{font-weight:700;display:flex;justify-content:space-between;gap:6px}
.lc .nm small{font-weight:500;color:var(--text-muted);font-size:11px;white-space:nowrap}
.lc .ph{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.lc .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lc .act{display:flex;gap:6px;margin-top:9px;align-items:center}
.drawer{position:fixed;inset:0;background:rgba(5,6,9,.55);z-index:90;display:flex;justify-content:flex-end}
.drawer .dr{background:var(--surface);border-left:1px solid var(--border);width:100%;max-width:460px;height:100%;overflow:auto;padding:22px}
.drawer h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px;margin:8px 0}
.kv dt{color:var(--text-muted)}.kv dd{margin:0}
.sec:not(.btn){font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin:20px 0 8px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{width:60px;height:74px;object-fit:cover;border-radius:8px}
.tema-grid{display:grid;grid-template-columns:1fr 410px;gap:20px;align-items:start}
.tema-grid .phone{position:sticky;top:76px}
.share-link{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;font-family:var(--font-mono);font-size:12px;word-break:break-all}
.stack{display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.ped{grid-template-columns:260px 1fr 320px}.ped .hdr-hint{display:none}}
@media (max-width:1000px){
  .ped{grid-template-columns:1fr;grid-template-rows:56px auto 1fr auto}
  .ped .lib{max-height:200px}.ped .insp{max-height:45vh}
  .ped>header{gap:6px;padding:0 8px}.ped>header .seg{display:none}
  .tema-grid{grid-template-columns:1fr}
  .pv{grid-template-columns:1fr}
  .picker{left:14px;width:calc(100% - 28px);top:110px;max-height:calc(100% - 124px)}
}
@media (max-width:700px){
  main.wrap{padding:14px 12px}
  .top{gap:8px;padding:0 10px;height:auto;min-height:56px;flex-wrap:wrap;padding-bottom:6px}
  .top .pname{display:none}
  .board{grid-template-columns:repeat(4,85%)}
  .fn-row{grid-template-columns:110px 1fr 80px}
  .grid2{grid-template-columns:1fr}
  .phone{width:100%;border-width:0;border-radius:0}
}
/* ===== Quiz (compartilhado: publicado + prévia do editor). Tudo escopado em .q-frame ===== */
.q-frame{background:var(--bg);color:var(--text);font-family:var(--q-font);font-size:16px;line-height:1.5;position:relative;-webkit-font-smoothing:antialiased}
.q-frame *{box-sizing:border-box}
.q-frame .pg{max-width:var(--q-maxw,480px);margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:var(--q-gap)}
.q-frame .blk{min-width:0}
.q-frame h2,.q-frame .b-tit h2{font-family:var(--q-font-t);font-weight:600;line-height:1.15;margin:0;color:var(--text)}
.q-frame p{margin:0}
.q-frame .ic{flex:none}
.q-frame b,.q-frame strong{font-weight:600}
/* animações */
@keyframes qFade{from{opacity:0}to{opacity:1}}
@keyframes qUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes qPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.q-frame .an-fade{animation:qFade .45s ease both}
.q-frame .an-sobe{animation:qUp .45s ease both}
.q-frame .an-pulsar{animation:qUp .45s ease both,qPulse 1.8s ease-in-out .6s infinite}
@media (prefers-reduced-motion:reduce){.q-frame [class*=" an-"]{animation:none!important}}
/* cabeçalho */
.q-frame .b-cab{display:flex;align-items:center;justify-content:center;position:relative;min-height:44px}
.q-frame .b-cab img{max-width:70%;object-fit:contain}
.q-frame .b-cab-back{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--text-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.q-frame .b-cab-back:hover{background:var(--surface-2)}
.q-frame .b-cab-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* progresso */
.q-frame .b-prog{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.q-frame .b-prog i{display:block;height:100%;background:var(--accent-deco);border-radius:6px}
/* textos */
.q-frame .b-tit h2{font-size:28px}
.q-frame .b-tit p{color:var(--text-muted);margin-top:6px}
.q-frame .b-txt{color:var(--text)}
.q-frame .b-nota{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--q-radius);padding:14px 16px;font-size:15px;color:var(--text)}
.q-frame .b-nota .ic{color:var(--accent)}
.q-frame .b-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.q-frame .b-lista li{display:flex;gap:10px;align-items:flex-start}
.q-frame .b-lista li>span:first-child{color:var(--accent);display:flex;margin-top:2px}
.q-frame .b-lista.dir li{flex-direction:row-reverse;text-align:right}
.q-frame .b-num{font-family:var(--q-font-t);font-weight:600;font-variant-numeric:tabular-nums}
/* mídia */
.q-frame .b-img{display:flex;justify-content:center}
.q-frame .b-img img{display:block;max-width:100%;height:auto;background:var(--surface-2)}
.q-frame .b-img img.clk{cursor:pointer;transition:transform .15s}
.q-frame .b-img img.clk:active{transform:scale(.98)}
.q-frame .b-img img.clk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.q-frame .b-car{position:relative}
.q-frame .b-car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--q-radius);scrollbar-width:none}
.q-frame .b-car-track::-webkit-scrollbar{display:none}
.q-frame .b-car figure{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative}
.q-frame .b-car img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
.q-frame .b-car figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));font-size:14px}
.q-frame .b-car-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.q-frame .b-car-dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.q-frame .b-car-dots i.on{background:var(--accent)}
.q-frame .b-vid{display:flex;justify-content:center}
.q-frame .b-vid .frame{position:relative;overflow:hidden;background:#000;margin:0 auto;max-width:100%}
.q-frame .b-vid .frame video,.q-frame .b-vid .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.q-frame .b-vid-som{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;background:rgba(0,0,0,.62);color:#fff;font:600 14px/1 var(--q-font);cursor:pointer;backdrop-filter:blur(6px);animation:qPulse 1.8s ease-in-out infinite}
.q-frame .b-vid-som[hidden]{display:none}
.q-frame .b-delay-tag{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--q-font);color:var(--text-muted);background:var(--surface-2);border-radius:999px;padding:4px 8px;margin-bottom:6px}
/* áudio estilo WhatsApp */
.q-frame .b-zap{display:flex;align-items:flex-end;gap:8px}
.q-frame .b-zap.dir{justify-content:flex-end}
.q-frame .b-zap .av{position:relative;width:46px;height:46px;flex:none}
.q-frame .b-zap .av img,.q-frame .b-zap .av span{width:46px;height:46px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--accent);font-weight:600}
.q-frame .b-zap .av i{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#1FAF5A;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.q-frame .b-zap .bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:8px 12px 6px;min-width:250px;max-width:340px;flex:1;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.q-frame .b-zap.dir .bubble{border-radius:16px 16px 4px 16px;background:#DCF8C6;color:#1D2B1D;flex:0 1 320px}
.q-frame .b-zap .who{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.q-frame .b-zap .pl{display:flex;align-items:center;gap:8px}
.q-frame .b-zap .pp{width:38px;height:38px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.q-frame .b-zap .pp .ic{fill:currentColor}
.q-frame .b-zap .wave{flex:1;height:30px;display:flex;align-items:center;gap:2px;cursor:pointer}
.q-frame .b-zap .wave i{flex:1;min-width:2px;border-radius:2px;background:color-mix(in srgb,var(--text-muted) 45%,transparent)}
.q-frame .b-zap .wave i.on{background:#1FAF5A}
.q-frame .b-zap .spd{border:0;border-radius:999px;background:var(--surface-2);color:var(--text-muted);font:600 11px/1 var(--q-font);padding:5px 7px;cursor:pointer;min-width:34px}
.q-frame .b-zap .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);padding-left:46px;margin-top:-2px}
.q-frame .b-zap.ouvido .pp{color:#34B7F1}
/* galeria */
.q-frame .b-gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q-frame .b-gal.c3{grid-template-columns:repeat(3,1fr)}
.q-frame .b-gal figure{margin:0;position:relative;cursor:zoom-in;border-radius:calc(var(--q-radius) - 2px);overflow:hidden;background:var(--surface-2)}
.q-frame .b-gal figure:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q-frame .b-gal img{width:100%;display:block;object-fit:cover;transition:transform .3s}
.q-frame .b-gal figure:hover img{transform:scale(1.03)}
.q-frame .b-gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.q-lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.94);display:flex;align-items:center;justify-content:center;padding:16px;animation:qFade .2s ease}
.q-frame .q-lightbox{position:fixed}
.q-lightbox figure{margin:0;max-width:min(92vw,560px);text-align:center;color:#fff;font-family:var(--q-font,system-ui)}
.q-lightbox img{max-width:100%;max-height:78vh;border-radius:12px;display:block;margin:0 auto}
.q-lightbox figcaption{margin-top:10px;font-size:15px}
.q-lightbox small{display:block;margin-top:4px;opacity:.6;font-size:12px}
.q-lightbox button{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.q-lightbox .x{top:16px;right:16px}.q-lightbox .p{left:12px;top:50%;transform:translateY(-50%)}.q-lightbox .n{right:12px;top:50%;transform:translateY(-50%)}
/* antes e depois */
.q-frame .b-cmp{position:relative;overflow:hidden;border-radius:var(--q-radius);background:var(--surface-2);user-select:none;max-width:100%}
.q-frame .b-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

/* ============================================================
   Quiz Veraneio — núcleo compartilhado (painel + quiz público)
   Elementos, funções e o motor que executa um fluxo.
   ============================================================ */

// ---------- utilidades ----------
const U = {
  esc: s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])),
  uid: (p = "") => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3),
  digits: s => String(s || "").replace(/\D/g, ""),
  clone: o => JSON.parse(JSON.stringify(o)),
  now: () => new Date().toISOString(),
  first: n => String(n || "").trim().split(/\s+/)[0] || "",
  phoneMask(v) {
    const d = U.digits(v).slice(0, 11);
    if (d.length <= 2) return d ? "(" + d : "";
    if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  },
  phoneFmt(w) { const d = U.digits(w); return d.length >= 10 ? U.phoneMask(d) : d; },
  // {{variavel}} → valor
  interp(str, vars) {
    return String(str ?? "").replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, k) => {
      if (k === "primeiroNome") return U.first(vars.nome);
      const v = vars[k]; return v === undefined || v === null ? "" : Array.isArray(v) ? v.join(", ") : String(v);
    });
  },
  // texto rico simples: **negrito**, *itálico*, __sublinhado__, ~~tachado~~, quebras de linha, {{vars}}
  rich(str, vars) {
    let s = U.esc(U.interp(str, vars || {}));
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__(.+?)__/g, "<u>$1</u>")
      .replace(/~~(.+?)~~/g, "<s>$1</s>").replace(/(^|[^*])\*([^*\n]+?)\*/g, "$1<i>$2</i>")
      .replace(/\[cor=(#[0-9a-fA-F]{3,8})\](.+?)\[\/cor\]/g, '<span style="color:$1">$2</span>')
      .replace(/\n/g, "<br>");
    return s;
  },
  money(v) { return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); },
  css: o => Object.entries(o).filter(([, v]) => v !== "" && v !== undefined && v !== null).map(([k, v]) => `${k}:${v}`).join(";"),

const OPS = [["igual", "é igual a"], ["diferente", "é diferente de"], ["contem", "contém"], ["naoContem", "não contém"], ["comeca", "começa com"], ["termina", "termina com"], ["maior", "maior que"], ["maiorIgual", "maior ou igual a"], ["menor", "menor que"], ["menorIgual", "menor ou igual a"], ["vazio", "está vazia"], ["naoVazio", "está preenchida"], ["regex", "combina com a expressão"], ["umDe", "é uma destas (vírgula)"]];
function testRule(r, vars) {
  const a = vars[r.var], A = Array.isArray(a) ? a.join(",") : String(a ?? ""), B = U.interp(r.valor ?? "", vars);
  const n = x => parseFloat(String(x).replace(",", "."));
  switch (r.op) {
    case "igual": return A.toLowerCase() === B.toLowerCase();
    case "diferente": return A.toLowerCase() !== B.toLowerCase();
    case "contem": return A.toLowerCase().includes(B.toLowerCase());
    case "naoContem": return !A.toLowerCase().includes(B.toLowerCase());
    case "comeca": return A.toLowerCase().startsWith(B.toLowerCase());
    case "termina": return A.toLowerCase().endsWith(B.toLowerCase());
    case "maior": return n(A) > n(B);
    case "maiorIgual": return n(A) >= n(B);
    case "menor": return n(A) < n(B);
    case "menorIgual": return n(A) <= n(B);
    case "vazio": return A.trim() === "";
    case "naoVazio": return A.trim() !== "";
    case "regex": try { return new RegExp(B, "i").test(A); } catch (e) { return false; }
    case "umDe": return B.split(",").map(s => s.trim().toLowerCase()).includes(A.toLowerCase());
  }
  return false;
}

    schema: [{ key: "grupos", label: "Caminhos (o primeiro que bater é usado)", type: "conditions" }],

  ab: {

    outputs: p => [{ id: "A", label: `${p.nomeA || "A"} · ${+p.pctA}%` }, { id: "B", label: `${p.nomeB || "B"} · ${100 - +p.pctA}%` }],
    summary: p => `${+p.pctA}% / ${100 - +p.pctA}%`,

  webhook: {
    cat: "integ", label: "Webhook", icon: "webhook", desc: "Envia os dados da cliente para outro sistema (POST)",
    def: () => ({ nome: "", url: "", token: "", enviar: "tudo", vars: "" }),
    schema: [{ key: "nome", label: "Nome", type: "text" }, { key: "url", label: "URL", type: "text" }, { key: "token", label: "Token (vai no corpo como 'token')", type: "text" }, { key: "enviar", label: "Enviar", type: "select", options: [["tudo", "Todas as variáveis e respostas"], ["lista", "Só estas variáveis"]] }, { key: "vars", label: "Variáveis (vírgula)", type: "text", show: p => p.enviar === "lista" }],

  divisao: {

    def: () => ({ caminhos: [{ id: U.uid("d"), nome: "Versão 1", peso: 34 }, { id: U.uid("d"), nome: "Versão 2", peso: 33 }, { id: U.uid("d"), nome: "Versão 3", peso: 33 }] }),
    schema: [{ key: "caminhos", label: "Caminhos (peso = parte do tráfego)", type: "items", itemLabel: "nome", newItem: () => ({ id: U.uid("d"), nome: "Nova versão", peso: 10 }), fields: [{ key: "nome", label: "Nome", type: "text" }, { key: "peso", label: "Peso", type: "number", min: 0, max: 100 }] }],
    outputs: p => { const t = (p.caminhos || []).reduce((a, c) => a + (+c.peso || 0), 0) || 1; return (p.caminhos || []).map(c => ({ id: c.id, label: `${c.nome} · ${Math.round((+c.peso || 0) / t * 100)}%` })); },
    summary: p => (p.caminhos || []).length + " caminhos",

  etiqueta: {

  evento: {
    cat: "integ", label: "Evento do Pixel", icon: "pixel", novo: true, desc: "Dispara um evento do Pixel/GTM quando a cliente passa por aqui",
    def: () => ({ evento: "Lead", nomeCustom: "", valor: "" }),
    schema: [{ key: "evento", label: "Evento", type: "select", options: ["Lead", "Contact", "CompleteRegistration", "ViewContent", "AddToCart", "InitiateCheckout", "Purchase", "Schedule", "SubmitApplication", "Subscribe", "Custom"].map(x => [x, x === "Custom" ? "Personalizado" : x]) }, { key: "nomeCustom", label: "Nome do evento", type: "text", show: p => p.evento === "Custom" }, { key: "valor", label: "Valor em R$ (opcional, pode usar {{variavel}})", type: "text" }],
    outputs: () => [{ id: "next", label: "Depois" }],

};

// saídas de um nó
function nodeOutputs(node) {
  if (!node) return [];
  if (node.type === "start") return [{ id: "next", label: "Início" }];
  if (node.type === "fn") { const F = FUNCS[node.data.kind]; return F ? F.outputs(node.data.props || {}) : []; }
  const outs = [];
  (node.data.blocos || []).forEach(b => { const B = BLOCKS[b.type]; if (B && B.outputs) outs.push(...B.outputs(b.props || {}, b)); });
  return outs;
}

/* ============================================================
   MOTOR — executa um projeto
   opts: { project:{flow,tema,config,nome}, root, mode:'live'|'preview', store, sessionKey, onEvent }
   store (opcional): { begin(sess), save(patch, novosVistos) }
   ============================================================ */
function createRunner(opts) {
  const { project, root } = opts;
  const flow = project.flow || { nodes: [], edges: [] };
  const cfg = project.config || {};
  const N = {}; flow.nodes.forEach(n => N[n.id] = n);
  const mode = opts.mode || "live";
  const KEY = opts.sessionKey;
  let S = null, timers = [], prevProgress = 0, lastPageProgress = 0;

  const emit = (t, d) => { try { opts.onEvent && opts.onEvent(t, d); } catch (e) { } };
  const persist = () => { if (KEY) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };
  const save = (patch, vista) => { if (opts.store && mode === "live") opts.store.save(S, patch, vista); };
  const edgeFrom = (nodeId, handle) => flow.edges.find(e => e.from === nodeId && e.handle === handle);
  const clearTimers = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };

  function fresh() {
    return { id: null, vars: {}, respostas: {}, escolhas: [], vistas: [], carrinho: [], cupom: "", ab: {}, tags: [], hist: [], atual: null, finalizado: false, criado: U.now() };
  }
  function derived() {
    const v = Object.assign({}, S.vars);
    v.escolhas = S.escolhas.join(" · ");
    v.carrinhoLink = cartUrl();
    v.carrinhoQtd = S.carrinho.reduce((a, c) => a + c.q, 0);
    return v;
  }
  function cartUrl() {
    const base = String(cfg.carrinhoBase || "").replace(/\/?$/, "/");
    if (!S.carrinho.length) return cfg.lojaUrl || base;
    return base + S.carrinho.map(c => `${c.sku}:${c.q}`).join(",") + (S.cupom ? "?promocode=" + encodeURIComponent(S.cupom) : "");
  }
  function waUrl(num, msg) {
    let n = num === "revenda" ? cfg.whatsRevenda : num === "varejo" ? cfg.whatsVarejo : num;
    n = U.digits(n); if (n.length <= 11) n = "55" + n;
    return `https://wa.me/${n}?text=${encodeURIComponent(U.interp(msg, derived()))}`;
  }

  // ---- navegação ----
  function follow(nodeId, handle) {
    const e = edgeFrom(nodeId, handle);
    if (!e) { emit("semSaida", { nodeId, handle }); if (mode === "preview") toastIn(root, "Esta saída ainda não está ligada a nada no fluxo"); return; }
    go(e.to);
  }
  function go(nodeId, fromBack) {
    const n = N[nodeId]; if (!n) return;
    if (!S.vistas.includes(nodeId)) S.vistas.push(nodeId);
    save({ etapa: nodeId, etapaNome: nodeName(n) }, nodeId);
    if (n.type === "start") return follow(n.id, "next");
    if (n.type === "fn") return runFn(n);
    if (!fromBack && S.atual && S.atual !== nodeId) S.hist.push(S.atual);
    // guarda como o carrinho e as respostas estavam ao chegar nesta página (para o Voltar desfazer as escolhas)
    S.snaps = S.snaps || {}; S.snaps[nodeId] = U.clone({ carrinho: S.carrinho, escolhas: S.escolhas, cupom: S.cupom, tags: S.tags, vars: S.vars, respostas: S.respostas });
    S.atual = nodeId; persist();
    renderPage(n);
    emit("pagina", { node: n });
  }
  function back() {
    const prev = S.hist.pop(); if (!prev) return;
    const sn = (S.snaps || {})[prev];
    if (sn) { Object.assign(S, U.clone(sn)); save({ carrinho: S.carrinho.map(c => c.sku + ":" + c.q), cupom: S.cupom, escolhas: S.escolhas, tags: S.tags, vars: S.vars, respostas: S.respostas }); }
    S.atual = prev; persist(); renderPage(N[prev]);
  }
  function nodeName(n) { return n.type === "page" ? (n.data.nome || "Página") : n.type === "fn" ? (FUNCS[n.data.kind]?.label || "Função") : "Início"; }
  function finish(destino, url, newTab) {
    S.finalizado = destino; persist();
    save({ finalizado: true, destino, finalizadoEm: U.now(), etapa: "concluido", etapaNome: destino === "whatsapp" ? "Foi para o WhatsApp" : destino === "site" ? "Foi para o site" : "Finalizou" }, "concluido");
    emit("fim", { destino, url });
    if (opts.store && opts.store.flush) opts.store.flush();
    if (!url) return;
    if (mode === "preview") { toastIn(root, "Na versão publicada a cliente iria para: " + url.slice(0, 120)); return; }
    setTimeout(() => { if (newTab) window.open(url, "_blank", "noopener"); else location.href = url; }, 250);
  }

  // ---- funções ----
  function runFn(n) {
    const p = n.data.props || {}, k = n.data.kind, v = derived();
    if (k === "link") {
      const url = p.destino === "carrinho" ? cartUrl() : p.destino === "loja" ? (cfg.lojaUrl || "") : U.interp(p.url, v);
      emit("pixel", { ev: p.destino === "carrinho" ? "InitiateCheckout" : "ViewContent" });
      const dest = p.destino !== "url" ? "site" : /wa\.me|whatsapp\.com/i.test(url) ? "whatsapp" : /\/r\/[A-Z0-9]+:\d|checkout|carrinho|seguro\./i.test(url) ? "site" : "link";
      if (p.finaliza !== false) finish(dest, url, p.novaAba); else if (mode === "live") location.href = url; else toastIn(root, "Iria para: " + url);
      return;
    }
    if (k === "whatsapp") {
      emit("pixel", { ev: "Contact" });
      const url = waUrl(p.numero === "outro" ? p.outro : p.numero, p.mensagem);
      if (p.finaliza !== false) finish("whatsapp", url); else if (mode === "live") location.href = url; else toastIn(root, "Abriria: " + url);
      return;
    }
    if (k === "carrinho") {
      if (p.acao === "limpar" || p.acao === "set") { S.carrinho = []; if (p.acao === "limpar") S.escolhas = []; }
      if (p.acao === "add" || p.acao === "set") {
        String(p.skus || "").split(/[\s,;]+/).map(s => s.trim()).filter(Boolean).forEach(sku => {
          const ex = S.carrinho.find(c => c.sku === sku); const q = Math.max(1, +p.qtd || 1);
          if (ex) ex.q += q; else S.carrinho.push({ sku, q });
        });
        if (p.rotulo) S.escolhas.push(U.interp(p.rotulo, v));
        emit("pixel", { ev: "AddToCart" });
      }
      if (p.cupom) S.cupom = p.cupom;
      save({ carrinho: S.carrinho.map(c => c.sku + ":" + c.q), cupom: S.cupom, escolhas: S.escolhas });
      persist(); return follow(n.id, "next");
    }
    if (k === "variavel") {
      const name = p.nome; if (name) {
        const raw = U.interp(p.valor, v), cur = S.vars[name];
        const num = x => parseFloat(String(x ?? 0).replace(",", ".")) || 0;
        let val;
        switch (p.op) { case "+": val = num(cur) + num(raw); break; case "-": val = num(cur) - num(raw); break; case "*": val = num(cur) * num(raw); break; case "/": val = num(raw) ? num(cur) / num(raw) : num(cur); break; case "append": val = [].concat(cur ?? [], raw); break; default: val = raw; }
        if (typeof val === "number") val = Math.round(val * 1000) / 1000;
        S.vars[name] = val; save({ vars: S.vars });
      }
      persist(); return follow(n.id, "next");
    }
    if (k === "condicao") {
      for (const g of p.grupos || []) {
        const res = (g.regras || []).map(r => testRule(r, v));
        const ok = res.length && (g.logica === "ou" ? res.some(Boolean) : res.every(Boolean));
        if (ok) return follow(n.id, g.id);
      }
      return follow(n.id, "senao");
    }
    if (k === "ab") {
      if (!S.ab[n.id]) { S.ab[n.id] = Math.random() * 100 < (+p.pctA || 0) ? "A" : "B"; save({ ab: S.ab }); persist(); }
      return follow(n.id, S.ab[n.id]);
    }
    if (k === "divisao") {
      const cs = p.caminhos || []; if (!cs.length) return;
      if (!S.ab[n.id] || !cs.some(c => c.id === S.ab[n.id])) {
        const w = cs.map(c => Math.max(0, +c.peso || 0)), allZero = w.every(x => !x), ws = allZero ? cs.map(() => 1) : w;
        let r = Math.random() * ws.reduce((a, x) => a + x, 0), pick = cs[cs.length - 1].id;
        for (let i = 0; i < cs.length; i++) { r -= ws[i]; if (r < 0) { pick = cs[i].id; break; } }
        S.ab[n.id] = pick; save({ ab: S.ab }); persist();
      }
      return follow(n.id, S.ab[n.id]);
    }
    if (k === "etiqueta") {
      const novas = U.interp(p.etiquetas, v).split(",").map(x => x.trim()).filter(Boolean).slice(0, 10);
      S.tags = [...new Set([...(S.tags || []), ...novas])].slice(0, 20);
      save({ tags: S.tags }); persist(); return follow(n.id, "next");
    }
    if (k === "evento") {
      const val = parseFloat(String(U.interp(p.valor, v)).replace(/[^\d,.-]/g, "").replace(",", "."));
      emit("pixel", { ev: p.evento === "Custom" ? (p.nomeCustom || "Evento") : p.evento, custom: p.evento === "Custom", data: isNaN(val) ? {} : { value: val, currency: "BRL" } });
      if (mode === "preview") toastIn(root, "Evento do Pixel: " + (p.evento === "Custom" ? p.nomeCustom : p.evento));
      return follow(n.id, "next");
    }
    if (k === "webhook") {
      if (mode === "live" && p.url) {
        const all = derived();
        const pick = p.enviar === "lista" ? Object.fromEntries(String(p.vars || "").split(",").map(s => s.trim()).filter(Boolean).map(x => [x, all[x]])) : all;
        const body = JSON.stringify({ token: p.token || undefined, quiz: project.nome, sessao: S.id, variaveis: pick, respostas: p.enviar === "lista" ? undefined : S.respostas, carrinho: S.carrinho, origem: S.origem || {}, enviadoEm: U.now() });
        const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
        if (ctl) setTimeout(() => ctl.abort(), 4000);
        // se a rede falhar, tenta mais uma vez depois de 2 s (sem travar a cliente)
        const send = (again) => { try { fetch(p.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body, keepalive: true, mode: "cors", signal: !again && ctl ? ctl.signal : undefined }).then(r => { if (again && r.type !== "opaque" && r.status >= 500) setTimeout(() => send(false), 2000); }).catch(() => { if (again) setTimeout(() => send(false), 2000); }); } catch (e) { } };
        send(true);
      } else if (mode === "preview") toastIn(root, "Webhook seria enviado para " + (p.url || "(sem URL)"));
      return follow(n.id, "next");
    }
  }

  // ---- página ----
  function renderPage(n) {
    clearTimers();
    root.querySelectorAll("audio,video").forEach(m => { try { m.pause(); } catch (e) { } });
    document.querySelectorAll(".q-lightbox").forEach(x => x.remove());
    const ctx = { vars: derived(), mode: "live", tema: project.tema || {}, nome: project.nome, canBack: S.hist.length > 0, prevProgress: lastPageProgress, k: n.id.slice(-4) };
    const blocos = n.data.blocos || [];
    const html = blocos.map(b => { const B = BLOCKS[b.type]; if (!B) return ""; try { return `<section class="blk" data-bid="${b.id}" id="b-${b.id}">${B.render(b.props || {}, ctx, b)}</section>`; } catch (e) { console.warn(e); return ""; } }).join("");
    root.innerHTML = `<div class="pg">${html}</div>`;
    const pr = blocos.find(b => b.type === "progresso"); if (pr) lastPageProgress = Math.max(0, Math.min(100, +pr.props.valor || 0));
    root.scrollTop = 0; if (mode === "live") window.scrollTo(0, 0);
    wire(n);
    // pixel por página
    blocos.filter(b => b.type === "pixel" && b.props.ativo !== false).forEach(b => emit("pixel", { ev: b.props.evento === "Custom" ? b.props.nomeCustom : b.props.evento, custom: b.props.evento === "Custom" }));
    emit("pixel", { ev: "QuizEtapa", custom: true, data: { etapa: n.data.nome || "" } });
  }

  function answer(n, label, valor, varName, pontos) {
    S.respostas[n.id] = label;
    if (varName) {
      S.vars[varName] = valor;
      if (pontos) { const k = varName + "_pontos"; S.vars[k] = (parseFloat(S.vars[k]) || 0) + (+pontos || 0); }
    }
    save({ respostas: S.respostas, vars: S.vars });
  }

  function wire(n) {
    const $ = s => root.querySelector(s), $$ = s => [...root.querySelectorAll(s)];
    const blk = id => (n.data.blocos || []).find(b => b.id === id);
    $$("[data-back]").forEach(b => b.onclick = back);
    // animações
    requestAnimationFrame(() => {
      $$("[data-prog-to]").forEach(i => requestAnimationFrame(() => { i.style.transition = "width .6s ease"; i.style.width = i.dataset.progTo + "%"; }));
      $$("[data-donut]").forEach(c => { c.style.transition = "stroke-dashoffset 1.2s ease"; c.style.strokeDashoffset = c.dataset.donut; });
    });
    // saídas simples (botão, imagem clicável, opção única)
    $$("[data-out]").forEach(el => {
      if (el.hasAttribute("data-multi-ok")) return;
      const act = () => {
        const h = el.dataset.out;
        // opção de quiz?
        const qEl = el.closest("[data-quiz]");
        if (qEl && el.dataset.opt) {
          const b = blk(qEl.dataset.quiz), o = (b.props.opcoes || []).find(x => x.id === el.dataset.opt);
          $$(`[data-quiz="${b.id}"] .b-opt`).forEach(x => x.classList.toggle("sel", x === el));
          answer(n, o.titulo, o.valor || o.titulo, b.props.variavel, o.pontos);
          timers.push(setTimeout(() => follow(n.id, h), 220));
          return;
        }
        const b = blk(h);
        if (b && b.type === "botao") S.respostas[n.id] = S.respostas[n.id] || b.props.texto;
        if (b && b.type === "imagem") S.respostas[n.id] = S.respostas[n.id] || ("Imagem: " + (b.props.alt || "clique"));
        if (b && (b.type === "altura" || b.type === "peso")) { /* valor já salvo pelo slider */ }
        save({ respostas: S.respostas });
        follow(n.id, h);
      };
      el.addEventListener("click", act);
      if (el.tagName === "IMG") el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
    });
    // âncoras
    $$("[data-anchor]").forEach(el => el.onclick = () => { const t = root.querySelector("#b-" + el.dataset.anchor); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); });
    // quiz múltiplo
    $$("[data-quiz]").forEach(q => {
      const b = blk(q.dataset.quiz); if (!b || !b.props.multipla) return;
      const sel = new Set();
      const ok = q.querySelector("[data-multi-ok]");
      q.querySelectorAll("[data-multi]").forEach(o => o.onclick = () => { const id = o.dataset.multi; sel.has(id) ? sel.delete(id) : sel.add(id); o.classList.toggle("sel", sel.has(id)); ok.disabled = sel.size === 0; });
      ok.onclick = () => {
        const os = (b.props.opcoes || []).filter(o => sel.has(o.id));
        const label = os.map(o => o.titulo).join(", ");

        if (b.props.variavel) { S.vars[b.props.variavel] = os.map(o => o.valor || o.titulo); const pts = os.reduce((a, o) => a + (+o.pontos || 0), 0); if (pts) S.vars[b.props.variavel + "_pontos"] = (parseFloat(S.vars[b.props.variavel + "_pontos"]) || 0) + pts; }

   Converte o fluxo de um projeto do XQuiz (nós, ligações, tema) no formato deste app,
   mantendo páginas, textos, imagens, opções, links e posições no mapa.

function xquizToProject(input) {

  const IMG = u => u ? "https://cdn.xquiz.co/images/" + u : "";
  const imgOf = o => o && (o.uuid ? IMG(o.uuid) : o.url || o.src || "");

    .replace(/<\s*(em|i)\b[^>]*>/gi, "*").replace(/<\s*\/\s*(em|i)\s*>/gi, "*")
    .replace(/<\s*u\b[^>]*>/gi, "__").replace(/<\s*\/\s*u\s*>/gi, "__")
    .replace(/<\s*br\s*\/?>/gi, "\n").replace(/<\s*\/\s*p\s*>\s*<\s*p[^>]*>/gi, "\n")
    .replace(/<[^>]+>/g, "")).replace(/\*\*\s*\*\*/g, "").replace(/\n{3,}/g, "\n\n").trim();
  const sz = s => ({ "text-xs": "sm", "text-sm": "sm", "text-base": "md", "text-lg": "xs", "text-xl": "sm", "text-2xl": "md", "text-3xl": "lg", "text-4xl": "xl" })[s] || "md";
  const al = a => ["left", "center", "right"].includes(a) ? a : "center";

  let warnings = [];

  const conv = (b) => {

    switch (b.type) {
      case "headerV2": case "header":
        return { id, type: "cabecalho", props: { logo: !!(d.logo || true), logoUrl: d.logo && d.logo.custom === false ? "" : imgOf(d.logo), tamanhoLogo: Math.max(24, Math.min(120, Math.round((d.logo && d.logo.size || 100) * 0.4))), voltar: !(d.backButton && d.backButton.show === false) } };
      case "image":
        return { id, type: "imagem", props: { url: imgOf(d.image), alt: "", largura: d.size === "w-full" || !d.size ? 100 : parseInt(String(d.size).replace(/\D/g, "")) || 100, raio: d.style === "rounded" ? 16 : 0, clicavel: !!d.clickable || !!d.link, animacao: anim(d.animation) } };

        return { id, type: "titulo", props: { titulo: html2txt(d.title), subtitulo: html2txt(d.subtitle), tamTitulo: sz(d.titleSize || "text-lg"), tamSub: sz(d.subtitleSize || "text-sm") === "md" ? "md" : "sm", alinhamento: al(d.alignment), cor: "", animacao: anim(d.animation) } };
      case "text":
        return { id, type: "texto", props: { texto: html2txt(d.text), tamanho: sz(d.size || "text-base"), entrelinha: 1.5, alinhamento: al(d.alignment), cor: "", animacao: anim(d.animation) } };
      case "button":
        return { id, type: "botao", props: { texto: html2txt(d.title).replace(/\*\*/g, "") || "Continuar", estilo: "cheio", destaque: !!d.fixed, atraso: d.videoDelay ? +d.videoDelayTime || 0 : 0, animacao: anim(d.animation), fundo: "", cor: "", borda: "", ancora: "", xq: true } };

  const count = {}; nodes.filter(n => n.type === "page").forEach(n => count[n.data.nome] = (count[n.data.nome] || 0) + 1);
  nodes.filter(n => n.type === "page" && count[n.data.nome] > 1).forEach(n => { const t = firstText(n); if (t) n.data.nomeOriginal = n.data.nome, n.data.nome = t; });

  const st = f.settings || {};
  const integ = st.integrations || f.integrations || [];
  const pix = (integ.find(i => i.type === "meta") || {}).key || "";
  const urls = nodes.filter(n => n.type === "fn").map(n => n.data.props.url);
  const wa = urls.map(u => (u.match(/wa\.me\/(\d+)/) || [])[1]).filter(Boolean);
  const cart = urls.find(u => /\/r\/[A-Z0-9]+:\d/.test(u));
  const config = {
    pixelId: pix, tituloSite: st.title || f.name || "", descricaoSite: st.description || "", headerScript: st.headerScript || "",
    whatsRevenda: wa[0] ? wa[0].replace(/^55/, "") : "", whatsVarejo: (wa.find(x => x !== wa[0]) || wa[0] || "").replace(/^55/, ""),
    carrinhoBase: cart ? cart.split("/r/")[0] + "/r/" : "", lojaUrl: (urls.find(u => /^https?:\/\/[^/]+\/?$/.test(u)) || ""),
  };
  return { nome: f.name || "Quiz importado do XQuiz", flow: { nodes, edges }, tema, config, avisos: [...new Set(warnings)] };
}

function setSaveState(err, msg) {

  el.className = "savest" + (err ? " err" : ST.dirty || ST.saving ? " dirty" : "");
  el.innerHTML = `<i></i>${err ? esc(msg || "Erro ao salvar — tentando de novo") : ST.saving ? "Salvando…" : ST.dirty ? "Alterações não salvas" : "Salvo"}`;
}
let savingP = null;
async function saveNow() {
  clearTimeout(saveTimer);
  while (savingP) await savingP; // espera o salvamento em andamento e salva de novo o que mudou nesse meio tempo
  if (!ST.project || !ST.dirty || ST.conflict) return;
  savingP = doSave(); try { await savingP; } finally { savingP = null; }
}
// alguém (outra pessoa ou outra aba) salvou este quiz depois que eu abri?
async function checkConflict(p) {
  let s; try { s = await DB.projects().doc(p.id).get(); } catch (e) { return false; }
  if (!s.exists) return { excluido: true };
  const r = s.data();
  if (ST.known && r.atualizadoEm && r.atualizadoEm !== ST.known) return { por: r.atualizadoPor || "Outra pessoa", em: r.atualizadoEm };
  return false;
}
function conflictDialog(c) {
  const quem = c.por === me.name ? "Você (em outra aba ou aparelho)" : esc(c.por);
  const m = modal({ title: c.excluido ? "Este quiz foi excluído" : "Outra pessoa alterou este quiz", body: c.excluido ? `<p style="margin-top:0">Enquanto você editava, este quiz foi excluído. Suas alterações não foram salvas para não recriá-lo.</p>` : `<p style="margin-top:0"><b>${quem}</b> salvou este quiz às ${esc(fmtDT(c.em))}, depois que você o abriu. Para não apagar o trabalho de ninguém, suas últimas alterações ainda não foram salvas.</p><p class="muted" style="font-size:13px">Recarregar traz a versão salva (você perde o que mudou agora). Manter a minha substitui a versão da outra pessoa.</p>`, foot: c.excluido ? `<button class="btn primary" data-home>Voltar aos quizzes</button>` : `<button class="btn sec" data-mine>Manter a minha</button><button class="btn primary" data-reload>Recarregar a versão salva</button>`, onClose: () => { } });
  const go2 = async keep => { m.close(); if (keep) { ST.conflict = false; ST.known = null; ST.dirty = true; await saveNow(); toast("Sua versão foi salva"); } else { ST.conflict = false; ST.dirty = false; const id = ST.pid; ST.pid = null; await openProject(id); if (ST.project) renderProject(currentTab()); toast("Versão salva carregada"); } };
  if ($("[data-mine]", m.el)) { $("[data-mine]", m.el).onclick = () => go2(true); $("[data-reload]", m.el).onclick = () => go2(false); }
  if ($("[data-home]", m.el)) $("[data-home]", m.el).onclick = () => { ST.conflict = false; ST.dirty = false; ST.project = null; ST.pid = null; m.close(); go(""); };
}
async function doSave() {
  const p = ST.project;
  const c = await checkConflict(p);
  if (c) { ST.conflict = true; setSaveState(true, c.excluido ? "Quiz excluído — não salvo" : "Não salvo: " + (c.por || "outra pessoa") + " alterou"); conflictDialog(c); return; }
  ST.saving = true; ST.dirty = false; setSaveState();
  const data = { nome: p.nome, slug: p.slug, status: p.status, pasta: p.pasta || null, flow: p.flow, tema: p.tema, config: p.config, criadoEm: p.criadoEm || U.now() };
  ["publicadoEm", "slugPublicado", "versaoPublicada"].forEach(k => { if (p[k] !== undefined) data[k] = p[k]; });
  const size = new Blob([JSON.stringify(data)]).size;
  if (size > 900000) { ST.saving = false; ST.dirty = true; setSaveState(true); toast("O quiz passou do tamanho máximo. Use imagens por link/upload, nunca coladas como texto.", 5000); return; }
  try { const now = U.now(); await DB.save(p.id, Object.assign(data, { atualizadoEm: now })); p.atualizadoEm = now; ST.known = now; ST.saving = false; setSaveState(); }
  catch (e) { ST.saving = false; ST.dirty = true; setSaveState(true); console.warn(e); saveTimer = setTimeout(saveNow, 5000); }
}

// ---------- publicar ----------
function validateFlow(p) {
  const errs = [], warns = [];
  const st = p.flow.nodes.find(n => n.type === "start");
  if (!p.flow.edges.some(e => e.from === st.id)) errs.push("O Início não está ligado a nenhuma página.");
  if (!/^[a-z0-9-]{3,40}$/.test(p.slug || "")) errs.push("O endereço do quiz (Configurações) precisa ter de 3 a 40 letras, números ou hífens.");
  p.flow.nodes.forEach(n => {
    if (n.type === "page" && !(n.data.blocos || []).length) warns.push(`A página "${n.data.nome}" está vazia.`);
    const outs = nodeOutputs(n);
    const lig = outs.filter(o => p.flow.edges.some(e => e.from === n.id && e.handle === o.id));
    if (n.type !== "start" && outs.length && lig.length < outs.length && !(n.type === "fn" && ["link", "whatsapp"].includes(n.data.kind))) warns.push(`"${n.type === "page" ? n.data.nome : FUNCS[n.data.kind]?.label}" tem ${outs.length - lig.length} saída(s) sem ligação.`);
  });
  const reach = new Set(); const q = [st.id];
  while (q.length) { const id = q.shift(); if (reach.has(id)) continue; reach.add(id); p.flow.edges.filter(e => e.from === id).forEach(e => q.push(e.to)); }
  const orf = p.flow.nodes.filter(n => !reach.has(n.id)); if (orf.length) warns.push(`${orf.length} nó(s) não são alcançados a partir do Início.`);
  return { errs, warns };
}
async function publish() {
  const p = ST.project; await saveNow();
  if (ST.conflict) return toast("Resolva o aviso de alteração antes de publicar", 4000);
  const { errs, warns } = validateFlow(p);
  if (errs.length) { modal({ title: "Ainda não dá para publicar", body: `<ul style="margin:0;padding-left:18px">${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` }); return; }
  if (warns.length && !await confirmBox("Publicar mesmo assim?", `<ul style="margin:0 0 6px;padding-left:18px">${warns.slice(0, 8).map(e => `<li>${esc(e)}</li>`).join("")}</ul>`, "Publicar")) return;
  if (!await DB.slugFree(p.slug, p.id)) return toast("Esse endereço já é usado por outro quiz. Troque em Configurações.", 4000);
  try {
    const cfg = U.clone(p.config);
    const versao = (p.versaoPublicada || 0) + 1;
    await DB.pub().doc(p.slug).set({ projectId: p.id, nome: p.nome, flow: p.flow, tema: p.tema, config: cfg, publicadoEm: U.now(), versao });
    if (p.slugPublicado && p.slugPublicado !== p.slug) { try { await DB.pub().doc(p.slugPublicado).delete(); } catch (e) { } }
    Object.assign(p, { status: "publicado", publicadoEm: U.now(), slugPublicado: p.slug, versaoPublicada: versao });
    ST.dirty = true; await saveNow();
    renderProject(currentTab());
    const url = PLAYER_URL(p.slug);
    const m = modal({ title: "Quiz publicado ✓", body: `<p style="margin-top:0">Pronto! Esse é o link para divulgar:</p><div class="share-link"><span style="flex:1">${esc(url)}</span><button class="btn sm sec" data-c>Copiar</button></div><p class="muted" style="font-size:12px">Toda vez que você mudar algo, clique em <b>Publicar</b> de novo para a cliente ver a nova versão.</p>`, foot: `<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Abrir quiz</a>` });
    $("[data-c]", m.el).onclick = () => { navigator.clipboard.writeText(url); toast("Link copiado"); };
  } catch (e) { toast("Erro ao publicar: " + e.message, 5000); }
}
async function unpublish() {
  const p = ST.project;
  if (!await confirmBox("Despublicar", "O link público vai parar de funcionar até você publicar de novo.", "Despublicar", true)) return;
  try { await DB.pub().doc(p.slugPublicado || p.slug).delete(); p.status = "rascunho"; ST.dirty = true; await saveNow(); renderProject(currentTab()); toast("Quiz despublicado"); }
  catch (e) { toast("Erro: " + e.message); }
}

/* ============ INSPETOR (formulário gerado pelo esquema) ============ */
const getPath = (o, path) => path.split(".").reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, path, v) => { const ks = path.split("."); let a = o; ks.slice(0, -1).forEach(k => { if (a[k] == null || typeof a[k] !== "object") a[k] = {}; a = a[k]; }); a[ks.at(-1)] = v; };
function knownVars() {
  const s = new Set(["nome", "whatsapp", "email", "primeiroNome", "escolhas", "carrinhoLink", "carrinhoQtd"]);
  (ST.project?.flow.nodes || []).forEach(n => {
    if (n.type === "page") (n.data.blocos || []).forEach(b => { const p = b.props || {}; if (p.variavel) { s.add(p.variavel); s.add(p.variavel + "_pontos"); } (p.campos || []).forEach(c => c.variavel && s.add(c.variavel)); });
    if (n.type === "fn" && n.data.kind === "variavel" && n.data.props?.nome) s.add(n.data.props.nome);
  });
  return [...s].filter(Boolean).sort();
}
/* buildForm(container, schema, obj, onChange(rerender?), ctx) */
function buildForm(box, schema, obj, onChange, ctx = {}) {
  const fid = U.uid("f");
  ctx = Object.assign({}, ctx, { schema });
  const vis = f => !f.show || f.show(obj);
  box.innerHTML = schema.filter(vis).map((f, i) => fieldHtml(f, getPath(obj, f.key), `${fid}${i}`, ctx)).join("") + `<datalist id="dl-vars">${knownVars().map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;
  schema.filter(vis).forEach((f, i) => bindField(box, f, `${fid}${i}`, obj, onChange, ctx));
}

  }

function bindField(box, f, id, obj, onChange, ctx) {
  const el = box.querySelector("#" + id); if (!el && !["color", "image"].includes(f.type)) return;
  const set = (v, rer) => { setPath(obj, f.key, v); onChange(rer || !!(f.rerender)); };
  const dependents = () => (ctx.schema || []).some(x => x.show);
  switch (f.type) {
    case "text": case "textarea": case "code": case "var": case "datetime": el.addEventListener("input", () => set(el.value)); break;
    case "number": el.addEventListener("input", () => set(el.value === "" ? "" : +el.value)); break;
    case "toggle": el.addEventListener("change", () => set(el.checked, dependents())); break;
    case "select": el.addEventListener("change", () => set(isNaN(el.value) || el.value === "" ? el.value : (typeof getPath(obj, f.key) === "number" ? +el.value : el.value), dependents())); break;

    case "image": { const w = box.querySelector("#" + id).closest(".imgf"), inp = w.querySelector("#" + id); inp.addEventListener("change", () => set(inp.value.trim(), true)); w.querySelector("[data-up]").addEventListener("change", async e => { const file = e.target.files[0]; if (!file) return; const lb = e.target.parentElement; lb.innerHTML = `<span class="spin" style="width:14px;height:14px;border-width:2px"></span> Enviando…`; try { const url = await DB.upload(file, ST.project?.id); set(url, true); toast("Arquivo enviado"); } catch (er) { toast("Erro no envio: " + er.message, 4000); onChange(true); } }); const rm = w.querySelector("[data-rm]"); if (rm) rm.onclick = () => set("", true); break; }
    case "icon": $$("[data-ic]", el).forEach(b => b.onclick = () => { $$("[data-ic]", el).forEach(x => x.setAttribute("aria-pressed", x === b)); set(b.dataset.ic); }); break;
    case "blockref": el.addEventListener("change", () => set(el.value, true)); break;
    case "items": {
      const arr = () => { let a = getPath(obj, f.key); if (!Array.isArray(a)) { a = []; setPath(obj, f.key, a); } return a; };
      const wrap = el.parentElement;
      $$("[data-sub]", el).forEach(sub => { const j = +sub.dataset.sub; buildForm(sub, f.fields, arr()[j], rer => { const t = sub.parentElement.querySelector(".t"); if (t) t.textContent = arr()[j][f.itemLabel] || `Item ${j + 1}`; onChange(rer); }, ctx); });
      el.querySelectorAll("summary button").forEach(b => b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); }, true));
      const op = (sel, fn) => $$(sel, el).forEach(b => b.onclick = e => { e.preventDefault(); fn(+Object.values(b.dataset)[0]); onChange(true); });
      op("[data-up-i]", j => { const a = arr(); [a[j - 1], a[j]] = [a[j], a[j - 1]]; });
      op("[data-dn-i]", j => { const a = arr(); [a[j + 1], a[j]] = [a[j], a[j + 1]]; });
      op("[data-dup-i]", j => { const a = arr(); const c = U.clone(a[j]); if (c.id) c.id = U.uid(String(c.id).replace(/[^a-z].*$/i, "") || "i"); a.splice(j + 1, 0, c); });
      op("[data-del-i]", j => { arr().splice(j, 1); });
      const add = wrap.querySelector("[data-add-i]"); if (add) add.onclick = () => { const a = arr(); a.push(f.newItem ? f.newItem() : Object.fromEntries(f.fields.map(x => [x.key.split(".")[0], x.type === "toggle" ? false : x.type === "number" ? 0 : ""]))); onChange(true); setTimeout(() => { const last = el.querySelector(".it:last-child"); if (last) last.open = true; }, 0); };
      break;
    }
    case "conditions": {
      const G = () => { let a = getPath(obj, f.key); if (!Array.isArray(a)) { a = []; setPath(obj, f.key, a); } return a; };
      $$("[data-g]", el).forEach(gEl => {
        const j = +gEl.dataset.g, g = G()[j];

const PERIODS = [["hoje", "Hoje"], ["7", "7 dias"], ["15", "15 dias"], ["mes", "Este mês"], ["mesPassado", "Mês passado"], ["tudo", "Tudo"], ["custom", "Personalizado"]];

function periodRange() {
  const P = ST.period, d0 = new Date(); d0.setHours(0, 0, 0, 0);
  if (P.k === "hoje") return [d0.getTime(), Infinity];
  if (P.k === "7" || P.k === "15") return [d0.getTime() - (+P.k - 1) * 86400000, Infinity];
  if (P.k === "mes") return [new Date(d0.getFullYear(), d0.getMonth(), 1).getTime(), Infinity];
  if (P.k === "mesPassado") return [new Date(d0.getFullYear(), d0.getMonth() - 1, 1).getTime(), new Date(d0.getFullYear(), d0.getMonth(), 1).getTime()];
  if (P.k === "custom") return [P.de ? new Date(P.de + "T00:00").getTime() : 0, P.ate ? new Date(P.ate + "T23:59:59").getTime() : Infinity];
  return [0, Infinity];
}
const inPeriod = l => { const [a, b] = periodRange(), t = new Date(l.criadoEm || 0).getTime(); return t >= a && t < b; };
function periodBar(onChange) {
  const P = ST.period;

  const bind = box => { $$("[data-per]", box).forEach(b => b.onclick = () => { P.k = b.dataset.per; onChange(); }); const de = $("[data-de]", box), at = $("[data-ate]", box); if (de) de.onchange = () => { P.de = de.value; onChange(); }; if (at) at.onchange = () => { P.ate = at.value; onChange(); }; };
  return { html, bind };
}
// páginas em ordem de fluxo (busca em largura a partir do Início)
function orderedPages(p = ST.project) {
  const st = p.flow.nodes.find(n => n.type === "start"); const seen = new Set(), out = [], q = st ? [st.id] : [];
  while (q.length) { const id = q.shift(); if (seen.has(id)) continue; seen.add(id); const n = p.flow.nodes.find(x => x.id === id); if (n && n.type === "page") out.push(n); p.flow.edges.filter(e => e.from === id).forEach(e => q.push(e.to)); }
  p.flow.nodes.filter(n => n.type === "page" && !seen.has(n.id)).forEach(n => out.push(n));
  return out;
}

const nodeLabel = (id, p = ST.project) => { if (id === "concluido") return "Finalizou"; const n = p.flow.nodes.find(x => x.id === id); return n ? n.type === "page" ? n.data.nome : n.type === "fn" ? FUNCS[n.data.kind]?.label : "Início" : "—"; };

TABS.estatisticas = {

  render(host) { this.host = host; this.draw(); },
  refresh() { if (this.host && document.body.contains(this.host)) this.draw(); },
