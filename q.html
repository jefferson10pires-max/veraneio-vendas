<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carregando…</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<style>
html,body{margin:0;min-height:100%;background:#FAF6EE}
body{min-height:100dvh}
.q-frame{min-height:100dvh}
.boot{display:flex;align-items:center;justify-content:center;min-height:100dvh}
.boot i{width:28px;height:28px;border:3px solid #E9DCC4;border-top-color:#8A6A3B;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.off{max-width:420px;margin:0 auto;padding:80px 24px;text-align:center;font-family:system-ui,sans-serif;color:#6B5D4E}
.off b{display:block;font-size:20px;color:#2F261D;margin-bottom:6px}
/* ===== Quiz (compartilhado: publicado + prévia do editor). Tudo escopado em .q-frame ===== */
.q-frame{background:var(--bg);color:var(--text);font-family:var(--q-font);font-size:16px;line-height:1.5;position:relative;-webkit-font-smoothing:antialiased}
.q-frame *{box-sizing:border-box}
.q-frame .pg{max-width:var(--q-maxw,480px);margin:0 auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:var(--q-gap)}
.q-frame .blk{min-width:0}
.q-frame h2,.q-frame .b-tit h2{font-family:var(--q-font-t);font-weight:600;line-height:1.15;margin:0;color:var(--text)}
.q-frame p{margin:0}
.q-frame .ic{flex:none}
.q-frame b,.q-frame strong{font-weight:600}
/* animações */
@keyframes qFade{from{opacity:0}to{opacity:1}}
@keyframes qUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes qPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.q-frame .an-fade{animation:qFade .45s ease both}
.q-frame .an-sobe{animation:qUp .45s ease both}
.q-frame .an-pulsar{animation:qUp .45s ease both,qPulse 1.8s ease-in-out .6s infinite}
@media (prefers-reduced-motion:reduce){.q-frame [class*=" an-"]{animation:none!important}}
/* cabeçalho */
.q-frame .b-cab{display:flex;align-items:center;justify-content:center;position:relative;min-height:44px}
.q-frame .b-cab img{max-width:70%;object-fit:contain}
.q-frame .b-cab-back{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--text-muted);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.q-frame .b-cab-back:hover{background:var(--surface-2)}
.q-frame .b-cab-back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* progresso */
.q-frame .b-prog{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.q-frame .b-prog i{display:block;height:100%;background:var(--accent-deco);border-radius:6px}
/* textos */
.q-frame .b-tit h2{font-size:28px}
.q-frame .b-tit p{color:var(--text-muted);margin-top:6px}
.q-frame .b-txt{color:var(--text)}
.q-frame .b-nota{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--q-radius);padding:14px 16px;font-size:15px;color:var(--text)}
.q-frame .b-nota .ic{color:var(--accent)}
.q-frame .b-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.q-frame .b-lista li{display:flex;gap:10px;align-items:flex-start}
.q-frame .b-lista li>span:first-child{color:var(--accent);display:flex;margin-top:2px}
.q-frame .b-lista.dir li{flex-direction:row-reverse;text-align:right}
.q-frame .b-num{font-family:var(--q-font-t);font-weight:600;font-variant-numeric:tabular-nums}
/* mídia */
.q-frame .b-img{display:flex;justify-content:center}
.q-frame .b-img img{display:block;max-width:100%;height:auto;background:var(--surface-2)}
.q-frame .b-img img.clk{cursor:pointer;transition:transform .15s}
.q-frame .b-img img.clk:active{transform:scale(.98)}
.q-frame .b-img img.clk:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.q-frame .b-car{position:relative}
.q-frame .b-car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--q-radius);scrollbar-width:none}
.q-frame .b-car-track::-webkit-scrollbar{display:none}
.q-frame .b-car figure{flex:0 0 100%;margin:0;scroll-snap-align:center;position:relative}
.q-frame .b-car img{width:100%;display:block;aspect-ratio:4/5;object-fit:cover}
.q-frame .b-car figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));font-size:14px}
.q-frame .b-car-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.q-frame .b-car-dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.q-frame .b-car-dots i.on{background:var(--accent)}
.q-frame .b-vid{display:flex;justify-content:center}
.q-frame .b-vid .frame{position:relative;overflow:hidden;background:#000;margin:0 auto;max-width:100%}
.q-frame .b-vid .frame video,.q-frame .b-vid .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.q-frame .b-vid-som{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 16px;background:rgba(0,0,0,.62);color:#fff;font:600 14px/1 var(--q-font);cursor:pointer;backdrop-filter:blur(6px);animation:qPulse 1.8s ease-in-out infinite}
.q-frame .b-vid-som[hidden]{display:none}
.q-frame .b-delay-tag{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--q-font);color:var(--text-muted);background:var(--surface-2);border-radius:999px;padding:4px 8px;margin-bottom:6px}
/* áudio estilo WhatsApp */
.q-frame .b-zap{display:flex;align-items:flex-end;gap:8px}
.q-frame .b-zap.dir{justify-content:flex-end}
.q-frame .b-zap .av{position:relative;width:46px;height:46px;flex:none}
.q-frame .b-zap .av img,.q-frame .b-zap .av span{width:46px;height:46px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--accent);font-weight:600}
.q-frame .b-zap .av i{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#1FAF5A;color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.q-frame .b-zap .bubble{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:8px 12px 6px;min-width:250px;max-width:340px;flex:1;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.q-frame .b-zap.dir .bubble{border-radius:16px 16px 4px 16px;background:#DCF8C6;color:#1D2B1D;flex:0 1 320px}
.q-frame .b-zap .who{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
.q-frame .b-zap .pl{display:flex;align-items:center;gap:8px}
.q-frame .b-zap .pp{width:38px;height:38px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.q-frame .b-zap .pp .ic{fill:currentColor}
.q-frame .b-zap .wave{flex:1;height:30px;display:flex;align-items:center;gap:2px;cursor:pointer}
.q-frame .b-zap .wave i{flex:1;min-width:2px;border-radius:2px;background:color-mix(in srgb,var(--text-muted) 45%,transparent)}
.q-frame .b-zap .wave i.on{background:#1FAF5A}
.q-frame .b-zap .spd{border:0;border-radius:999px;background:var(--surface-2);color:var(--text-muted);font:600 11px/1 var(--q-font);padding:5px 7px;cursor:pointer;min-width:34px}
.q-frame .b-zap .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);padding-left:46px;margin-top:-2px}
.q-frame .b-zap.ouvido .pp{color:#34B7F1}
/* galeria */
.q-frame .b-gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q-frame .b-gal.c3{grid-template-columns:repeat(3,1fr)}
.q-frame .b-gal figure{margin:0;position:relative;cursor:zoom-in;border-radius:calc(var(--q-radius) - 2px);overflow:hidden;background:var(--surface-2)}
.q-frame .b-gal figure:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q-frame .b-gal img{width:100%;display:block;object-fit:cover;transition:transform .3s}
.q-frame .b-gal figure:hover img{transform:scale(1.03)}
.q-frame .b-gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.q-lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.94);display:flex;align-items:center;justify-content:center;padding:16px;animation:qFade .2s ease}
.q-frame .q-lightbox{position:fixed}
.q-lightbox figure{margin:0;max-width:min(92vw,560px);text-align:center;color:#fff;font-family:var(--q-font,system-ui)}
.q-lightbox img{max-width:100%;max-height:78vh;border-radius:12px;display:block;margin:0 auto}
.q-lightbox figcaption{margin-top:10px;font-size:15px}
.q-lightbox small{display:block;margin-top:4px;opacity:.6;font-size:12px}
.q-lightbox button{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.q-lightbox .x{top:16px;right:16px}.q-lightbox .p{left:12px;top:50%;transform:translateY(-50%)}.q-lightbox .n{right:12px;top:50%;transform:translateY(-50%)}
/* antes e depois */
.q-frame .b-cmp{position:relative;overflow:hidden;border-radius:var(--q-radius);background:var(--surface-2);user-select:none;max-width:100%}
.q-frame .b-cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.q-frame .b-cmp .top{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.q-frame .b-cmp .hnd{position:absolute;top:0;bottom:0;left:var(--pos);width:3px;margin-left:-1.5px;background:#fff;pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.3)}
.q-frame .b-cmp .hnd i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#2F261D;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.q-frame .b-cmp .lb{position:absolute;top:10px;font:600 12px/1 var(--q-font);color:#fff;background:rgba(0,0,0,.5);padding:5px 9px;border-radius:999px;pointer-events:none}
.q-frame .b-cmp .lb.l{left:10px}.q-frame .b-cmp .lb.r{right:10px}
.q-frame .b-cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.q-frame .b-aud{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--q-radius);padding:10px}
.q-frame .b-aud img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.q-frame .b-aud-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.q-frame .b-aud audio{width:100%}
/* botão */
.q-frame .b-btn-wrap.fixo{position:sticky;bottom:12px;z-index:3}
.q-frame .b-btn{display:block;width:100%;min-height:52px;border-radius:var(--q-radius);border:1.5px solid transparent;padding:14px 18px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;text-align:center;transition:transform .1s,filter .15s}
.q-frame .b-btn.cheio{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.q-frame .b-btn.contorno{background:transparent;color:var(--accent);border-color:var(--accent)}
.q-frame .b-btn.whats{background:#147A3F;color:#fff}
.q-frame .b-btn:hover{filter:brightness(1.06)}
.q-frame .b-btn:active{transform:scale(.985)}
.q-frame .b-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.q-frame .b-btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
/* quiz */
.q-frame .b-quiz{display:flex;flex-direction:column;gap:12px}
.q-frame .b-quiz-grid{display:grid;gap:10px}
.q-frame .b-quiz-grid.c2{grid-template-columns:1fr 1fr}
.q-frame .b-quiz-grid.c3{grid-template-columns:1fr 1fr 1fr}
.q-frame .b-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--q-radius);padding:12px 14px;font:inherit;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.q-frame .b-opt:hover{border-color:var(--accent-deco)}
.q-frame .b-opt:active{transform:scale(.985)}
.q-frame .b-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q-frame .b-opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.q-frame .b-opt .t{flex:1;display:flex;flex-direction:column}
.q-frame .b-opt.ctr{justify-content:center;text-align:center}
.q-frame .b-opt.ctr .t{align-items:center}
.q-frame .b-opt.bb{border-bottom-width:4px}
.q-frame .b-opt.ts-sm{font-size:14px}.q-frame .b-opt.ts-lg{font-size:18px}
.q-frame .b-opt .t small{color:var(--text-muted);font-size:13px}
.q-frame .b-opt .emo{font-size:24px;line-height:1}
.q-frame .b-opt img{border-radius:calc(var(--q-radius) - 4px);object-fit:cover;background:var(--surface-2)}
.q-frame .b-opt.m-imgEsq img{width:64px;height:64px}
.q-frame .b-opt.m-imgCima,.q-frame .b-opt.m-imagem{flex-direction:column;align-items:stretch;text-align:center;padding:8px}
.q-frame .b-opt.m-imgCima img,.q-frame .b-opt.m-imagem img{width:100%;aspect-ratio:4/5}
.q-frame .b-opt.m-imgCima .t{align-items:center;padding:2px 4px 4px;font-weight:500}
.q-frame .b-opt .mk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex:none}
.q-frame .b-opt .mk.sq{border-radius:6px}
.q-frame .b-opt.m-imgCima .mk,.q-frame .b-opt.m-imagem .mk{position:absolute;margin:8px}
.q-frame .b-opt{position:relative}
.q-frame .b-opt.sel .mk{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
/* formulário */
.q-frame .b-form{display:flex;flex-direction:column;gap:12px}
.q-frame .b-form .fld{display:flex;flex-direction:column;gap:6px}
.q-frame .b-form .fld>span{font-size:14px;color:var(--text-muted);padding-left:2px}
.q-frame .b-form .fld em{font-style:normal;font-size:12px}
.q-frame .b-form input{width:100%;min-height:52px;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--q-radius);padding:12px 14px;font:inherit;font-size:16px;color:var(--text);outline:none}
.q-frame .b-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.q-frame .b-form .err{color:#B3261E;font-size:13px;min-height:0}
.q-frame .b-form .fld.bad input{border-color:#B3261E}
.q-frame .b-form-aviso{font-size:12px;color:var(--text-muted);text-align:center}
/* slider */
.q-frame .b-sld{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.q-frame .b-sld .val{font-size:18px;color:var(--text-muted)}
.q-frame .b-sld .val b{font-family:var(--q-font-t);font-size:44px;color:var(--text)}
.q-frame .b-sld input{accent-color:var(--accent);width:100%;height:32px}
.q-frame .b-sld small{color:var(--text-muted)}
/* carregamento */
.q-frame .b-load{display:flex;flex-direction:column;gap:10px;text-align:center;padding:24px 0}
.q-frame .b-load b{font-family:var(--q-font-t);font-size:24px}
.q-frame .b-load p{color:var(--text-muted)}
.q-frame .b-load-bar{position:relative;height:28px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
.q-frame .b-load-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
.q-frame .b-load-bar span{position:relative;line-height:28px;font-size:13px;font-weight:600;color:var(--text)}
.q-frame .b-redir{text-align:center;color:var(--text-muted);font-size:14px}
/* venda */
.q-frame .b-gar{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--q-radius);padding:14px 16px;font-size:15px}
.q-frame .b-gar .ic{color:var(--accent)}
.q-frame .b-gar.al-center{flex-direction:column;text-align:center}
.q-frame .b-gar b{display:block}
.q-frame .b-dep{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--q-radius);padding:16px}
.q-frame .b-dep.al-center{text-align:center}.q-frame .b-dep.al-center .b-dep-top,.q-frame .b-dep.al-center .stars{justify-content:center}
.q-frame .b-dep-top{display:flex;gap:10px;align-items:center}
.q-frame .b-dep-top img,.q-frame .b-dep-top .av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent)}
.q-frame .b-dep-top small{display:block;color:var(--text-muted);font-size:13px}
.q-frame .stars{display:flex;gap:2px;margin:8px 0 4px;color:#C9962C}
.q-frame .stars span{display:flex;opacity:.25}.q-frame .stars span.on{opacity:1}
.q-frame .stars .ic{fill:currentColor}
.q-frame .b-dep blockquote{margin:0;font-size:15px}
.q-frame .b-preco{position:relative;background:var(--surface);border:1.5px solid var(--accent-deco);border-radius:var(--q-radius);overflow:hidden}
.q-frame .b-preco .selo{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.q-frame .b-preco-h{display:flex;gap:12px;align-items:center;padding:16px}
.q-frame .b-preco-h>span{color:var(--accent-deco);display:flex}
.q-frame .b-preco-h small{display:block;color:var(--text-muted);font-size:13px}
.q-frame .b-preco-v{background:var(--surface-2);padding:14px 16px;display:flex;flex-direction:column;align-items:center}
.q-frame .b-preco-v s{color:var(--text-muted);font-size:14px}
.q-frame .b-preco-v strong{font-family:var(--q-font-t);font-size:36px;line-height:1.1;color:var(--text)}
.q-frame .b-preco-v small{color:var(--text-muted)}
.q-frame .b-ben{background:var(--surface);border:1px solid var(--border);border-radius:var(--q-radius);padding:16px}
.q-frame .b-ben .h{display:block;margin-bottom:8px;font-family:var(--q-font-t);font-size:20px}
.q-frame .b-ben ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q-frame .b-ben li{display:flex;gap:10px;align-items:flex-start}
.q-frame .b-ben li .ic{color:var(--accent);margin-top:2px}
.q-frame .b-tr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.q-frame .b-tr-ar{color:var(--accent)}
.q-frame .b-tr-s{background:var(--surface);border:1px solid var(--border);border-radius:var(--q-radius);padding:10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.q-frame .b-tr-s img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:calc(var(--q-radius) - 4px)}
.q-frame .b-tr-s small{color:var(--text-muted);font-size:13px}
.q-frame .b-tr-s .lvl{font-size:11px;color:var(--text-muted);text-align:left;margin-top:4px}
.q-frame .b-tr-s .bar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;margin-top:3px}
.q-frame .b-tr-s .bar i{display:block;height:100%;background:var(--text-muted)}
.q-frame .b-tr-s.b .bar i{background:var(--accent)}
.q-frame .b-tr-aviso{font-size:12px;color:var(--text-muted);text-align:center;margin-top:6px}
.q-frame .b-cron{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);border-radius:var(--q-radius);padding:10px 14px;font-size:15px}
.q-frame .b-cron.fixo{position:sticky;top:8px;z-index:4}
.q-frame .b-cron .t{font-variant-numeric:tabular-nums;font-size:18px}
.q-frame .b-acc{display:flex;flex-direction:column}
.q-frame .b-acc details{border-bottom:1px solid var(--border)}
.q-frame .b-acc summary{list-style:none;cursor:pointer;padding:14px 2px;display:flex;justify-content:space-between;gap:10px;font-weight:500}
.q-frame .b-acc summary::-webkit-details-marker{display:none}
.q-frame .b-acc summary .ic{transition:transform .2s;color:var(--text-muted)}
.q-frame .b-acc details[open] summary .ic{transform:rotate(180deg)}
.q-frame .b-acc details>div{padding:0 2px 14px;color:var(--text-muted);font-size:15px}
/* relatórios */
.q-frame .b-rel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--q-radius);padding:18px}
.q-frame .b-rel .donut{width:140px;height:140px;transform:rotate(-90deg)}
.q-frame .b-rel .donut circle{fill:none;stroke-width:10}
.q-frame .b-rel .donut .bg{stroke:var(--surface-2)}
.q-frame .b-rel .donut .fg{stroke-linecap:round}
.q-frame .b-rel .donut text{transform:rotate(90deg);transform-origin:50px 50px;font-size:20px;font-weight:600;fill:var(--text)}
.q-frame .b-rel small{display:block;color:var(--text-muted)}
.q-frame .b-rel img{width:100%;border-radius:calc(var(--q-radius) - 4px)}
.q-frame .b-niv{display:flex;flex-direction:column;gap:6px}
.q-frame .b-niv strong{font-family:var(--q-font-t);font-size:26px}
.q-frame .b-niv .trk{position:relative;height:12px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--accent));margin:30px 0 4px}
.q-frame .b-niv .pin{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);transform:translate(-50%,-50%)}
.q-frame .b-niv .pin em{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:12px;background:var(--text);color:var(--bg);padding:2px 8px;border-radius:6px}
.q-frame .b-niv .lv{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)}
.q-frame .b-bar{display:flex;gap:12px;align-items:flex-end;height:180px;padding-top:6px}
.q-frame .b-bar .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.q-frame .b-bar .bx{flex:1;width:100%;display:flex;align-items:flex-end}
.q-frame .b-bar .bx i{width:100%;background:var(--accent);border-radius:8px 8px 3px 3px}
.q-frame .b-bar .rot{font-size:12px;font-weight:600}
.q-frame .b-bar small{font-size:12px;color:var(--text-muted)}
.q-frame .b-lin svg{width:100%;height:130px;display:block}
.q-frame .b-lin .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)}
.q-frame .b-part{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-frame .b-part>div{background:var(--surface);border:1px solid var(--border);border-radius:var(--q-radius);padding:12px;display:flex;flex-direction:column;gap:2px}
.q-frame .b-part .ic{color:var(--accent)}
.q-frame .b-part small{color:var(--text-muted);font-size:12px}
/* layout */
.q-frame .b-box{border:1px solid transparent;background:var(--surface)}
.q-frame .b-box.sh{box-shadow:0 6px 20px rgba(0,0,0,.08)}
.q-frame .b-esp{display:flex;align-items:center}.q-frame .b-esp hr{flex:1;border:0;border-top:1px solid var(--border)}
/* vazios (editor) */
.q-frame .b-vazio{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--border);border-radius:var(--q-radius);padding:22px;color:var(--text-muted);font-size:13px;text-align:center}
.q-frame .b-vazio.sm{flex-direction:row;padding:8px 12px}
.q-frame .vazio-q{text-align:center;color:var(--text-muted);padding:40px 0}
.q-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#2F261D;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:30;max-width:90%;text-align:center;font-family:system-ui,sans-serif}
body>.q-toast{position:fixed}

</style>

<body>
<div id="q" class="q-frame"><div class="boot" aria-label="Carregando"><i></i></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script>
/* ============================================================
   Quiz Veraneio — núcleo compartilhado (painel + quiz público)
   Elementos, funções e o motor que executa um fluxo.
   ============================================================ */

// ---------- utilidades ----------
const U = {
  esc: s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])),
  uid: (p = "") => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3),
  digits: s => String(s || "").replace(/\D/g, ""),
  clone: o => JSON.parse(JSON.stringify(o)),
  now: () => new Date().toISOString(),
  first: n => String(n || "").trim().split(/\s+/)[0] || "",
  phoneMask(v) {
    const d = U.digits(v).slice(0, 11);
    if (d.length <= 2) return d ? "(" + d : "";
    if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
    return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  },
  phoneFmt(w) { const d = U.digits(w); return d.length >= 10 ? U.phoneMask(d) : d; },
  // {{variavel}} → valor
  interp(str, vars) {
    return String(str ?? "").replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, k) => {
      if (k === "primeiroNome") return U.first(vars.nome);
      const v = vars[k]; return v === undefined || v === null ? "" : Array.isArray(v) ? v.join(", ") : String(v);
    });
  },
  // texto rico simples: **negrito**, *itálico*, __sublinhado__, ~~tachado~~, quebras de linha, {{vars}}
  rich(str, vars) {
    let s = U.esc(U.interp(str, vars || {}));
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__(.+?)__/g, "<u>$1</u>")
      .replace(/~~(.+?)~~/g, "<s>$1</s>").replace(/(^|[^*])\*([^*\n]+?)\*/g, "$1<i>$2</i>")
      .replace(/\[cor=(#[0-9a-fA-F]{3,8})\](.+?)\[\/cor\]/g, '<span style="color:$1">$2</span>')
      .replace(/\n/g, "<br>");
    return s;
  },
  money(v) { return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); },
  css: o => Object.entries(o).filter(([, v]) => v !== "" && v !== undefined && v !== null).map(([k, v]) => `${k}:${v}`).join(";"),
};

// ---------- ícones (traço 1.75, desenhados para este projeto) ----------
const ICON_PATHS = {

  whatsapp: '<path d="M20 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.3A8.5 8.5 0 1 1 20 11.5z"/><path d="M8.5 9c0 3 2.5 6 6 6.5l1.2-1.4-1.8-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-1.8z"/>',

  olho: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  imagem: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  texto: '<path d="M5 6h14M5 12h14M5 18h9"/>', titulo: '<path d="M6 4v16M18 4v16M6 12h12"/>',
  botao: '<rect x="3" y="8" width="18" height="8" rx="4"/><path d="M9 12h6"/>',

const icon = (name, size = 20, cls = "") => `<svg class="ic ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ICON_PATHS.info}</svg>`;

// ---------- opções comuns ----------
const ANIM = { key: "animacao", label: "Animação de entrada", type: "select", options: [["fade", "Aparecer"], ["sobe", "Subir"], ["pulsar", "Pulsar"], ["nenhuma", "Nenhuma"]] };
const ALIGN = { key: "alinhamento", label: "Alinhamento", type: "select", options: [["left", "Esquerda"], ["center", "Centro"], ["right", "Direita"]] };
const SIZE = (key = "tamanho", label = "Tamanho") => ({ key, label, type: "select", options: [["xs", "Extra pequeno"], ["sm", "Pequeno"], ["md", "Padrão"], ["lg", "Grande"], ["xl", "Extra grande"]] });
const COR = (key, label) => ({ key, label, type: "color" });
const anim = p => p.animacao && p.animacao !== "nenhuma" ? ` an-${p.animacao}` : "";
const al = p => p.alinhamento ? ` style="text-align:${p.alinhamento}"` : "";
const FS = { xs: "13px", sm: "14px", md: "16px", lg: "20px", xl: "26px" };
const TS = { xs: "18px", sm: "22px", md: "28px", lg: "34px", xl: "42px" };

// out(id, label) marca um elemento clicável que leva a uma saída do fluxo
const outAttr = id => `data-out="${U.esc(id)}"`;

/* ============================================================
   ELEMENTOS
   Cada um: label, cat, icon, def() (props iniciais), schema (inspetor),
   render(props, ctx, block) → HTML, outputs(props, block) → [{id,label}]
   ctx: { vars, mode, page, progress }
   ============================================================ */
const CATS = [["cab", "Cabeçalho"], ["txt", "Texto"], ["mid", "Mídia"], ["acao", "Ação"], ["entrada", "Entrada de dados"], ["venda", "Venda"], ["relat", "Relatórios"], ["esp", "Especiais"], ["rastr", "Rastreamento"], ["layout", "Layout"]];

const BLOCKS = {
  cabecalho: {
    label: "Cabeçalho", cat: "cab", icon: "cabecalho",
    def: () => ({ logo: true, logoUrl: "", tamanhoLogo: 36, voltar: true }),
    schema: [{ key: "logo", label: "Mostrar logo", type: "toggle" }, { key: "logoUrl", label: "Logo diferente do tema (opcional)", type: "image" }, { key: "tamanhoLogo", label: "Altura do logo (px)", type: "number", min: 16, max: 120 }, { key: "voltar", label: "Botão voltar", type: "toggle" }],
    render: (p, ctx) => `<div class="b-cab">${p.voltar ? `<button class="b-cab-back" data-back aria-label="Voltar"${ctx.canBack ? "" : " hidden"}>${icon("voltar", 22)}</button>` : ""}${p.logo && (p.logoUrl || ctx.tema.logo) ? `<img src="${U.esc(p.logoUrl || ctx.tema.logo)}" alt="${U.esc(ctx.nome || "Logo")}" style="height:${+p.tamanhoLogo || 36}px">` : ""}</div>`,
  },
  progresso: {
    label: "Progresso", cat: "cab", icon: "progresso",
    def: () => ({ valor: 25, cor1: "", cor2: "", fundo: "" }),
    schema: [{ key: "valor", label: "Progresso nesta página (%)", type: "number", min: 0, max: 100 }, COR("cor1", "Cor inicial"), COR("cor2", "Cor final"), COR("fundo", "Cor de fundo")],
    render: (p, ctx) => {
      const from = ctx.prevProgress ?? 0, to = Math.max(0, Math.min(100, +p.valor || 0));
      return `<div class="b-prog" style="${U.css({ background: p.fundo })}"><i data-prog-to="${to}" style="width:${from}%;${p.cor1 ? `background:linear-gradient(90deg,${p.cor1},${p.cor2 || p.cor1})` : ""}"></i></div>`;
    },
  },
  titulo: {
    label: "Título", cat: "txt", icon: "titulo",
    def: () => ({ titulo: "Seu título aqui", subtitulo: "", tamTitulo: "md", tamSub: "md", alinhamento: "center", cor: "", animacao: "fade" }),
    schema: [{ key: "titulo", label: "Título", type: "textarea", rich: true }, { key: "subtitulo", label: "Subtítulo", type: "textarea", rich: true }, SIZE("tamTitulo", "Tamanho do título"), SIZE("tamSub", "Tamanho do subtítulo"), ALIGN, COR("cor", "Cor do texto"), ANIM],
    render: (p, ctx) => `<div class="b-tit${anim(p)}"${al(p)}><h2 style="${U.css({ "font-size": TS[p.tamTitulo], color: p.cor })}">${U.rich(p.titulo, ctx.vars)}</h2>${p.subtitulo ? `<p style="font-size:${FS[p.tamSub] || "16px"}">${U.rich(p.subtitulo, ctx.vars)}</p>` : ""}</div>`,
  },
  texto: {
    label: "Texto", cat: "txt", icon: "texto",
    def: () => ({ texto: "Escreva aqui. Use **negrito**, *itálico* e {{nome}} para personalizar.", tamanho: "md", entrelinha: 1.5, alinhamento: "center", cor: "", animacao: "fade" }),
    schema: [{ key: "texto", label: "Texto", type: "textarea", rich: true }, SIZE(), { key: "entrelinha", label: "Altura da linha", type: "number", min: 1, max: 2.5, step: 0.1 }, ALIGN, COR("cor", "Cor do texto"), ANIM],
    render: (p, ctx) => `<div class="b-txt${anim(p)}" style="${U.css({ "text-align": p.alinhamento, "font-size": FS[p.tamanho], "line-height": p.entrelinha, color: p.cor })}">${U.rich(p.texto, ctx.vars)}</div>`,
  },
  nota: {
    label: "Nota", cat: "txt", icon: "info",

const OPS = [["igual", "é igual a"], ["diferente", "é diferente de"], ["contem", "contém"], ["naoContem", "não contém"], ["comeca", "começa com"], ["termina", "termina com"], ["maior", "maior que"], ["maiorIgual", "maior ou igual a"], ["menor", "menor que"], ["menorIgual", "menor ou igual a"], ["vazio", "está vazia"], ["naoVazio", "está preenchida"], ["regex", "combina com a expressão"], ["umDe", "é uma destas (vírgula)"]];
function testRule(r, vars) {
  const a = vars[r.var], A = Array.isArray(a) ? a.join(",") : String(a ?? ""), B = U.interp(r.valor ?? "", vars);
  const n = x => parseFloat(String(x).replace(",", "."));
  switch (r.op) {
    case "igual": return A.toLowerCase() === B.toLowerCase();
    case "diferente": return A.toLowerCase() !== B.toLowerCase();
    case "contem": return A.toLowerCase().includes(B.toLowerCase());
    case "naoContem": return !A.toLowerCase().includes(B.toLowerCase());
    case "comeca": return A.toLowerCase().startsWith(B.toLowerCase());
    case "termina": return A.toLowerCase().endsWith(B.toLowerCase());
    case "maior": return n(A) > n(B);
    case "maiorIgual": return n(A) >= n(B);
    case "menor": return n(A) < n(B);
    case "menorIgual": return n(A) <= n(B);
    case "vazio": return A.trim() === "";
    case "naoVazio": return A.trim() !== "";
    case "regex": try { return new RegExp(B, "i").test(A); } catch (e) { return false; }
    case "umDe": return B.split(",").map(s => s.trim().toLowerCase()).includes(A.toLowerCase());
  }
  return false;
}

// saídas de um nó
function nodeOutputs(node) {
  if (!node) return [];
  if (node.type === "start") return [{ id: "next", label: "Início" }];
  if (node.type === "fn") { const F = FUNCS[node.data.kind]; return F ? F.outputs(node.data.props || {}) : []; }
  const outs = [];
  (node.data.blocos || []).forEach(b => { const B = BLOCKS[b.type]; if (B && B.outputs) outs.push(...B.outputs(b.props || {}, b)); });
  return outs;
}

/* ============================================================
   MOTOR — executa um projeto
   opts: { project:{flow,tema,config,nome}, root, mode:'live'|'preview', store, sessionKey, onEvent }
   store (opcional): { begin(sess), save(patch, novosVistos) }
   ============================================================ */
function createRunner(opts) {
  const { project, root } = opts;
  const flow = project.flow || { nodes: [], edges: [] };
  const cfg = project.config || {};
  const N = {}; flow.nodes.forEach(n => N[n.id] = n);
  const mode = opts.mode || "live";
  const KEY = opts.sessionKey;
  let S = null, timers = [], prevProgress = 0, lastPageProgress = 0;

  const emit = (t, d) => { try { opts.onEvent && opts.onEvent(t, d); } catch (e) { } };
  const persist = () => { if (KEY) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } };
  const save = (patch, vista) => { if (opts.store && mode === "live") opts.store.save(S, patch, vista); };
  const edgeFrom = (nodeId, handle) => flow.edges.find(e => e.from === nodeId && e.handle === handle);
  const clearTimers = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };

  function fresh() {
    return { id: null, vars: {}, respostas: {}, escolhas: [], vistas: [], carrinho: [], cupom: "", ab: {}, tags: [], hist: [], atual: null, finalizado: false, criado: U.now() };
  }
  function derived() {
    const v = Object.assign({}, S.vars);
    v.escolhas = S.escolhas.join(" · ");
    v.carrinhoLink = cartUrl();
    v.carrinhoQtd = S.carrinho.reduce((a, c) => a + c.q, 0);
    return v;
  }
  function cartUrl() {
    const base = String(cfg.carrinhoBase || "").replace(/\/?$/, "/");
    if (!S.carrinho.length) return cfg.lojaUrl || base;
    return base + S.carrinho.map(c => `${c.sku}:${c.q}`).join(",") + (S.cupom ? "?promocode=" + encodeURIComponent(S.cupom) : "");
  }
  function waUrl(num, msg) {
    let n = num === "revenda" ? cfg.whatsRevenda : num === "varejo" ? cfg.whatsVarejo : num;
    n = U.digits(n); if (n.length <= 11) n = "55" + n;
    return `https://wa.me/${n}?text=${encodeURIComponent(U.interp(msg, derived()))}`;
  }

  // ---- navegação ----
  function follow(nodeId, handle) {
    const e = edgeFrom(nodeId, handle);
    if (!e) { emit("semSaida", { nodeId, handle }); if (mode === "preview") toastIn(root, "Esta saída ainda não está ligada a nada no fluxo"); return; }
    go(e.to);
  }
  function go(nodeId, fromBack) {
    const n = N[nodeId]; if (!n) return;
    if (!S.vistas.includes(nodeId)) S.vistas.push(nodeId);
    save({ etapa: nodeId, etapaNome: nodeName(n) }, nodeId);
    if (n.type === "start") return follow(n.id, "next");
    if (n.type === "fn") return runFn(n);
    if (!fromBack && S.atual && S.atual !== nodeId) S.hist.push(S.atual);
    S.atual = nodeId; persist();
    renderPage(n);
    emit("pagina", { node: n });
  }
  function back() {
    const prev = S.hist.pop(); if (!prev) return;
    S.atual = prev; persist(); renderPage(N[prev]);
  }
  function nodeName(n) { return n.type === "page" ? (n.data.nome || "Página") : n.type === "fn" ? (FUNCS[n.data.kind]?.label || "Função") : "Início"; }
  function finish(destino, url, newTab) {
    S.finalizado = destino; persist();
    save({ finalizado: true, destino, finalizadoEm: U.now(), etapa: "concluido", etapaNome: destino === "whatsapp" ? "Foi para o WhatsApp" : destino === "site" ? "Foi para o site" : "Finalizou" }, "concluido");
    emit("fim", { destino, url });
    if (opts.store && opts.store.flush) opts.store.flush();
    if (!url) return;
    if (mode === "preview") { toastIn(root, "Na versão publicada a cliente iria para: " + url.slice(0, 120)); return; }
    setTimeout(() => { if (newTab) window.open(url, "_blank", "noopener"); else location.href = url; }, 250);
  }

  // ---- funções ----
  function runFn(n) {
    const p = n.data.props || {}, k = n.data.kind, v = derived();
    if (k === "link") {
      const url = p.destino === "carrinho" ? cartUrl() : p.destino === "loja" ? (cfg.lojaUrl || "") : U.interp(p.url, v);
      emit("pixel", { ev: p.destino === "carrinho" ? "InitiateCheckout" : "ViewContent" });
      const dest = p.destino !== "url" ? "site" : /wa\.me|whatsapp\.com/i.test(url) ? "whatsapp" : /\/r\/[A-Z0-9]+:\d|checkout|carrinho|seguro\./i.test(url) ? "site" : "link";
      if (p.finaliza !== false) finish(dest, url, p.novaAba); else if (mode === "live") location.href = url; else toastIn(root, "Iria para: " + url);
      return;
    }
    if (k === "whatsapp") {
      emit("pixel", { ev: "Contact" });
      const url = waUrl(p.numero === "outro" ? p.outro : p.numero, p.mensagem);
      if (p.finaliza !== false) finish("whatsapp", url); else if (mode === "live") location.href = url; else toastIn(root, "Abriria: " + url);
      return;
    }
    if (k === "carrinho") {
      if (p.acao === "limpar" || p.acao === "set") { S.carrinho = []; if (p.acao === "limpar") S.escolhas = []; }
      if (p.acao === "add" || p.acao === "set") {
        String(p.skus || "").split(/[\s,;]+/).map(s => s.trim()).filter(Boolean).forEach(sku => {
          const ex = S.carrinho.find(c => c.sku === sku); const q = Math.max(1, +p.qtd || 1);
          if (ex) ex.q += q; else S.carrinho.push({ sku, q });
        });
        if (p.rotulo) S.escolhas.push(U.interp(p.rotulo, v));
        emit("pixel", { ev: "AddToCart" });
      }
      if (p.cupom) S.cupom = p.cupom;
      save({ carrinho: S.carrinho.map(c => c.sku + ":" + c.q), cupom: S.cupom, escolhas: S.escolhas });
      persist(); return follow(n.id, "next");
    }
    if (k === "variavel") {
      const name = p.nome; if (name) {
        const raw = U.interp(p.valor, v), cur = S.vars[name];
        const num = x => parseFloat(String(x ?? 0).replace(",", ".")) || 0;
        let val;
        switch (p.op) { case "+": val = num(cur) + num(raw); break; case "-": val = num(cur) - num(raw); break; case "*": val = num(cur) * num(raw); break; case "/": val = num(raw) ? num(cur) / num(raw) : num(cur); break; case "append": val = [].concat(cur ?? [], raw); break; default: val = raw; }
        if (typeof val === "number") val = Math.round(val * 1000) / 1000;

  const off = (t, s) => { root.innerHTML = `<div class="off"><b>${U.esc(t)}</b>${U.esc(s || "")}</div>`; document.title = t; };
  const meta = (name, content, prop) => { if (!content) return; const m = document.createElement("meta"); m.setAttribute(prop ? "property" : "name", name); m.content = content; document.head.appendChild(m); };

  // origem (UTM) — guardada na primeira visita da sessão
  function origem() {
    const o = {};
    ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "src", "sck", "fbclid", "gclid"].forEach(k => { const v = qs.get(k); if (v) o[k] = v.slice(0, 200); });
    if (document.referrer && !document.referrer.startsWith(location.origin)) o.referrer = document.referrer.slice(0, 200);
    return o;
  }

  // gravação no Firestore: junta mudanças e grava em lote; se cair a internet, tenta de novo
  function makeStore(projectId) {
    const pend = {}; let vistas = [], timer = null, began = false, S = null, retry = 2000;
    const flush = async () => {
      clearTimeout(timer); if (!S || !S.id || !db || TESTE) return;
      const data = Object.assign({}, pend); Object.keys(pend).forEach(k => delete pend[k]);
      const vv = vistas; vistas = [];
      data.atualizadoEm = U.now();
      if (vv.length) data.vistas = firebase.firestore.FieldValue.arrayUnion(...vv);
      try { await db.collection("quiz_leads").doc(S.id).set(data, { merge: true }); retry = 2000; }
      catch (e) { Object.keys(data).forEach(k => { if (k !== "vistas" && !(k in pend)) pend[k] = data[k]; }); vistas = vv.concat(vistas); timer = setTimeout(flush, retry = Math.min(retry * 2, 30000)); }
    };
    return {
      begin(sess) {
        S = sess; if (TESTE || !db) { S.id = S.id || "teste"; return; }
        const novo = !S.id;
        if (novo) S.id = db.collection("quiz_leads").doc().id;
        if (!began) {
          began = true;
          const base = { projectId, atualizadoEm: U.now() };
          if (novo) Object.assign(base, { criadoEm: U.now(), status: "novo", origem: S.origem || {}, vistas: [] });
          db.collection("quiz_leads").doc(S.id).set(base, { merge: true }).catch(() => { });
        }
      },
      save(sess, patch, vista) { S = sess; Object.assign(pend, patch || {}); if (vista) vistas.push(vista); clearTimeout(timer); timer = setTimeout(flush, 150); },
      flush,
    };
  }

  function pixel(id) {
    if (!id || TESTE) return;
    !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s) }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", id); fbq("track", "PageView");
  }
  function gtm(id) {
    if (!id || TESTE || !/^GTM-[A-Z0-9]+$/i.test(id)) return;
    window.dataLayer = window.dataLayer || []; window.dataLayer.push({ "gtm.start": Date.now(), event: "gtm.js" });
    const s = document.createElement("script"); s.async = true; s.src = "https://www.googletagmanager.com/gtm.js?id=" + id; document.head.appendChild(s);
  }
  function headScript(html) {
    if (!html || TESTE) return;
    const box = document.createElement("div"); box.innerHTML = html;
    [...box.childNodes].forEach(n => {
      if (n.tagName === "SCRIPT") { const s = document.createElement("script"); [...n.attributes].forEach(a => s.setAttribute(a.name, a.value)); s.textContent = n.textContent; document.head.appendChild(s); }
      else if (n.nodeType === 1) document.head.appendChild(n);
    });
  }

  async function boot() {
    if (!slug) return off("Quiz não encontrado", "Confira o link que você recebeu.");
    if (!db) return off("Sem conexão", "Verifique sua internet e tente de novo.");
    let snap;
    try { snap = await db.collection("quiz_public").doc(slug).get(); }
    catch (e) { return off("Sem conexão", "Verifique sua internet e recarregue a página."); }
    if (!snap.exists) return off("Este quiz não está disponível", "Ele pode ter sido encerrado. Fale com a Veraneio pelo Instagram.");
    const P = snap.data(), cfg = P.config || {}, tema = P.tema || {};
    document.title = cfg.tituloSite || P.nome || "Quiz";
    document.querySelector('meta[name="robots"]').content = cfg.robos ? "index,follow" : "noindex";
    meta("description", cfg.descricaoSite); meta("og:title", cfg.tituloSite || P.nome, true); meta("og:description", cfg.descricaoSite, true); meta("og:image", cfg.imagemSite, true);
    if (tema.favicon) { const l = document.createElement("link"); l.rel = "icon"; l.href = tema.favicon; document.head.appendChild(l); }
    const f = document.createElement("link"); f.rel = "stylesheet"; f.href = fontHref(tema); document.head.appendChild(f);
    root.setAttribute("style", themeCss(tema)); document.body.style.background = tema.corFundo || "#FAF6EE";
    document.querySelector('meta[name="theme-color"]').content = tema.corFundo || "#FAF6EE";
    pixel(cfg.pixelId); gtm(cfg.gtmId); headScript(cfg.headerScript);
    const store = makeStore(P.projectId);
    const runner = createRunner({
      project: P, root, mode: "live", store, origem: origem(),
      sessionKey: TESTE ? null : "vq:" + slug + ":v" + (P.versao || 1),
      onEvent(t, d) {
        if (t === "pixel" && window.fbq && d.ev) { try { fbq(d.custom ? "trackCustom" : "track", d.ev, d.data || {}); } catch (e) { } }
        if (t === "pixel" && window.dataLayer && d.ev) window.dataLayer.push({ event: "quiz_" + d.ev });
      },
    });
    runner.start();
    window.addEventListener("pagehide", () => store.flush());
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") store.flush(); });
  }
  boot();
})();

</script>
