<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conversas Veraneio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<style>
/* Layout: barra lateral fixa + área de trabalho; conversas em 3 colunas (lista · chat · cliente) */
:root{color-scheme:light;
  --bg:#F4F5F7;--card:#FFFFFF;--card2:#F1F2F5;--hover:#F7F8FA;--sel:#FBF5EA;
  --ink:#171A1F;--ink2:#545B67;--ink3:#8B919C;--line:#E3E5EA;--line2:#EEF0F3;
  --gold:#8F6118;--gold2:#B07D2E;--goldsoft:#F6EDDC;--out:#F6EDDC;--in:#FFFFFF;--note:#FFF8DB;--noteline:#E9D48A;
  --green:#1E8452;--greensoft:#E3F3EA;--red:#BF3F2B;--redsoft:#FBE7E3;--amber:#9C5A06;--ambersoft:#FCEFD8;--blue:#2361A3;--bluesoft:#E5EEF8;
  --r:8px;--r2:12px;--shadow:0 12px 32px rgba(23,26,31,.12);
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
.hide{display:none!important}
.muted{color:var(--ink2)}
.tiny{font-size:12px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:14px;height:14px}
h1,h2,h3{font-family:var(--sans);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px;font-weight:700}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:700}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);height:36px;padding:0 14px;font-weight:600;font-size:13.5px;line-height:1;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:#D3D6DD}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.pri:hover{background:#7A5212}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--card2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.item:focus-visible,.nav button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
input[type=text],input[type=tel],input[type=password],input[type=search],input[type=datetime-local],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 11px;font-size:13.5px;min-height:36px}
input:hover,textarea:hover,select:hover{border-color:#D3D6DD}
textarea{resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--ink2);white-space:nowrap;line-height:1.5}
.pill.green{background:var(--greensoft);color:var(--green)}
.pill.red{background:var(--redsoft);color:var(--red)}
.pill.amber{background:var(--ambersoft);color:var(--amber)}
.pill.blue{background:var(--bluesoft);color:var(--blue)}
.pill.gold{background:var(--goldsoft);color:var(--gold)}
.pill svg.i{width:13px;height:13px}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* boot e login */
#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--ink3)}
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:32px;width:min(400px,100%)}
.lcard h1{margin-bottom:4px}
.users{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 6px}
.ubtn{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px;font-weight:600}
.ubtn[aria-pressed=true]{border-color:var(--gold);background:var(--goldsoft);color:var(--gold)}
#lmsg{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}

/* casca */
#app{display:grid;grid-template-columns:232px 1fr;height:100%}
.nav{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:2px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--ink);color:#E6C88E;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--ink3);margin-top:-2px}
.navlbl{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;padding:8px 10px 6px}
.nav button[data-go]{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:0;border-radius:var(--r);background:transparent;color:var(--ink2);font-weight:600;font-size:13.5px;text-align:left}
.nav button[data-go]:hover{background:var(--card2);color:var(--ink)}
.nav button[aria-current=page]{background:var(--goldsoft);color:var(--gold)}
.nav .lbl{flex:1}
.nav .badge{background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px;font-weight:700;font-style:normal}
.nav .sp{flex:1}
#logout{display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--line2);background:transparent;padding:12px 8px 2px;text-align:left;border-radius:0}
#logout:hover .lbl{color:var(--ink)}
#logout .lbl{font-weight:600;font-size:13px;color:var(--ink2)}
#logout small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.me{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.view{min-width:0;min-height:0;overflow:hidden}
.demo-flag{background:var(--ambersoft);color:#6A3F06;font-size:12px;font-weight:600;padding:8px 10px;border-radius:var(--r);margin:0 0 10px;line-height:1.35}
.demo-flag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:7px;vertical-align:1px}

/* conversas */
.conv{display:grid;grid-template-columns:340px minmax(0,1fr) 320px;height:100%}
.conv.noinfo{grid-template-columns:340px minmax(0,1fr)}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--card)}
.lhead{padding:16px 16px 10px}
.lhead .row{margin-bottom:12px}
.lsearch{position:relative}
.lsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.lsearch input{padding-left:34px;background:var(--bg);border-color:transparent}
.lsearch input:focus{background:var(--card);border-color:var(--line)}
.chips{display:flex;gap:4px;overflow-x:auto;padding:0 16px 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip:hover{background:var(--card2)}
.chip[aria-pressed=true]{background:var(--goldsoft);color:var(--gold)}
.chip b{font-weight:700;margin-left:4px;font-size:11.5px;background:var(--card2);color:var(--ink2);padding:0 5px;border-radius:5px}
.chip[aria-pressed=true] b{background:#fff;color:var(--gold)}
.items{overflow-y:auto;flex:1;min-height:0}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line2);cursor:pointer;background:transparent;width:100%;text-align:left;border-top:0;border-right:0;border-left:0;box-shadow:inset 3px 0 0 transparent}
.item:hover{background:var(--hover)}
.item[aria-current=true]{background:var(--sel);box-shadow:inset 3px 0 0 var(--gold)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13.5px;flex:none}
.av.sm{width:32px;height:32px;font-size:12px}
.item .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm .star{color:var(--gold2);margin-right:3px}
.item .lt{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.item .lt.unread{color:var(--ink);font-weight:600}
.item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.item .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.item .tags .pill{font-size:11px;padding:1px 6px}
.ub{background:var(--green);color:#fff;border-radius:99px;font-size:11px;min-width:19px;height:19px;display:grid;place-items:center;font-weight:700;padding:0 5px}
.wait{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--amber)}
.wait.late{color:var(--red)}
.wait svg.i{width:12px;height:12px}
.empty{padding:40px 24px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px}

.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);min-height:62px}
.chead .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .sub{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:1px}
.chead .sub span{white-space:nowrap}
.chead select{width:auto;min-height:32px;padding:4px 8px;font-size:12.5px}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:20px 5% 10px;min-height:0;position:relative}
.day{text-align:center;margin:16px 0 10px}
.day span{font-size:11.5px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink2);padding:2px 10px;border-radius:99px}
.m{display:flex;margin:4px 0}
.m.out{justify-content:flex-end}
.m.note{justify-content:center}
.b{max-width:min(540px,76%);background:var(--in);border:1px solid var(--line);border-radius:10px;padding:8px 11px 5px;position:relative}
.m.in .b{border-top-left-radius:3px}
.m.out .b{background:var(--out);border-color:#ECDDBF;border-top-right-radius:3px}
.m.note .b{background:var(--note);border:1px dashed var(--noteline);max-width:min(620px,90%)}
.b .who{font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:2px;display:flex;gap:5px;align-items:center}
.m.out .b .who{color:var(--gold)}
.b .who svg.i{width:12px;height:12px}
.b .tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:13.5px}
.b .ft{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:11px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.b .st.read{color:var(--blue)}
.b .st.fail{color:var(--red)}
.b img.media{display:block;max-width:100%;max-height:320px;border-radius:7px;margin:2px 0 4px;cursor:zoom-in}
.b video.media{display:block;max-width:100%;max-height:320px;border-radius:7px;margin:2px 0 4px}
.b audio{width:260px;max-width:100%;margin:2px 0}
.b .doc{display:flex;gap:8px;align-items:center;background:rgba(23,26,31,.04);border-radius:7px;padding:8px 10px;margin:2px 0 4px;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}
.b .tpl{font-size:10.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.b .tbtns{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.b .tbtns span{border-top:1px solid #E6D6B8;padding-top:5px;text-align:center;color:var(--blue);font-size:13px;font-weight:600}
.b .quote{border-left:3px solid var(--gold2);background:rgba(23,26,31,.04);border-radius:5px;padding:4px 8px;margin-bottom:4px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.b .err{font-size:12px;color:var(--red);margin-top:3px}
.b .acts{position:absolute;top:-13px;right:6px;display:none;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:1px;box-shadow:0 2px 6px rgba(23,26,31,.08)}
.m:hover .b .acts,.b:focus-within .acts{display:flex}
.b .acts button{border:0;background:transparent;padding:3px 7px;font-size:11.5px;font-weight:600;border-radius:5px;color:var(--ink2)}
.b .acts button:hover{background:var(--card2)}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--gold2)}100%{box-shadow:0 0 0 0 transparent}}
.tolast{position:absolute;right:20px;bottom:150px;z-index:3;box-shadow:0 2px 8px rgba(23,26,31,.1)}
.banner{margin:0 16px 8px;padding:10px 12px;border-radius:var(--r);font-size:13px;display:flex;gap:10px;align-items:center;border:1px solid transparent}
.banner.closed{background:var(--redsoft);color:#7A2618;border-color:#F3CFC7}
.banner.warn{background:var(--ambersoft);color:#6A3F06;border-color:#F3DDB4}
.sugs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sug{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink)}
.sug svg.i{width:14px;height:14px;color:var(--gold)}
.sug:hover{border-color:var(--gold2);background:var(--sel)}
.sug.quiet{color:var(--ink2)}
.sug.quiet svg.i{color:var(--ink3)}
.comp{background:var(--card);border-top:1px solid var(--line);padding:8px 12px 12px}
.comp.note{background:#FFFCEE}
.ctabs{display:flex;gap:2px;margin-bottom:8px}
.ctab{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.ctab[aria-pressed=true]{background:var(--card2);color:var(--ink)}
.comp.note .ctab[aria-pressed=true]{background:var(--note);color:#6A5409}
.cbox{display:flex;align-items:flex-end;gap:4px}
.cbox textarea{border-radius:10px;min-height:40px;max-height:180px;resize:none;background:var(--bg);border-color:transparent;padding:10px 12px}
.cbox textarea:focus{background:var(--card);border-color:var(--line)}
.comp.note .cbox textarea{background:#FFFDF4;border-color:var(--noteline)}
.reply{display:flex;align-items:center;gap:8px;background:var(--bg);border-left:3px solid var(--gold2);border-radius:6px;padding:6px 10px;margin-bottom:6px;font-size:13px;color:var(--ink2)}
.qr{position:absolute;bottom:100%;left:12px;right:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);max-height:260px;overflow:auto;margin-bottom:6px;z-index:5}
.qr button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px}
.qr button[aria-selected=true],.qr button:hover{background:var(--sel)}
.qr b{color:var(--gold);margin-right:6px}
.qr small{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attach-prev{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:var(--r);padding:6px;margin-bottom:6px;font-size:13px}
.attach-prev img{width:52px;height:52px;object-fit:cover;border-radius:6px}

.info{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;min-height:0}
.info .sec{padding:16px 18px;border-bottom:1px solid var(--line2)}
.mobile-only{display:none}
.info-close{display:none!important;position:absolute;top:10px;right:10px}
.info .sec:first-child{position:relative}
.info .sec h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.info .sec h4 a{text-transform:none;letter-spacing:0;font-weight:600;text-decoration:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px}
.kv small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500}
.kv b{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ord{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;font-variant-numeric:tabular-nums}
.ord:last-child{border-bottom:0}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagbox .pill button{border:0;background:transparent;padding:0;margin-left:2px;color:inherit;font-size:13px;line-height:1}
.tagbox input{width:120px;min-height:26px;padding:2px 8px;font-size:12.5px;border-radius:6px;border-style:dashed}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;padding:4px 0}
.switch input{width:36px;height:20px;appearance:none;background:#D5D8DE;border-radius:99px;position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{left:18px}

/* páginas */
.page{height:100%;overflow-y:auto;padding:28px clamp(16px,3vw,36px) 60px}
.page .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page .ph p{margin:4px 0 0;color:var(--ink2);max-width:640px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:14px;background:var(--line2);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.stats div{padding:9px 12px;background:var(--card);min-width:0}
.stats small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500}
.stats b{font-size:15px;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.mode{border:1px solid var(--line);border-radius:var(--r2);padding:16px;text-align:left;background:var(--card);display:flex;flex-direction:column;justify-content:flex-start}
.mode:hover{border-color:#D3D6DD}
.mode[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldsoft)}
.mode h3{font-size:15px;margin-bottom:2px}
.mode ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.mode li{margin:3px 0}
.mode li.c{color:#8A3426}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 34px;font-size:13.5px}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:6px;background:var(--card2);color:var(--ink2);display:grid;place-items:center;font-size:12px;font-weight:700}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden}

  dayLabel(ts) {

  norm: s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(),

  interp: (t, v) => String(t || "").replace(/\{\{?\s*(\w+)\s*\}?\}/g, (m, k) => v[k] != null && v[k] !== "" ? v[k] : m),

function modal(title, body, foot, wide) {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="md ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-label="${U.esc(title)}"><div class="mh"><h3>${U.esc(title)}</h3><button class="btn ghost icon" data-x aria-label="Fechar">${icon("x")}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ""}</div>`;
  const prev = document.activeElement;
  const close = () => { ov.remove(); document.removeEventListener("keydown", esc); prev && prev.focus && prev.focus(); };
  const esc = e => { if (e.key === "Escape") close(); };
  ov.addEventListener("mousedown", e => { if (e.target === ov) close(); });
  $("[data-x]", ov).onclick = close; document.addEventListener("keydown", esc);
  document.body.appendChild(ov);
  setTimeout(() => { const f = $("input,textarea,select", $(".mb", ov)) || $("[data-x]", ov); f && f.focus(); }, 30);
  return { el: ov, close };
}

function ask(title, text, okLabel = "Confirmar", input, type = "tel") {
  return new Promise(res => {
    const m = modal(title, `<p style="white-space:pre-line;margin:12px 0 0">${U.esc(text)}</p>${input ? `<input type="${type}" id="askIn" placeholder="${U.esc(input)}" style="margin-top:12px">` : ""}`, `<button class="btn" data-no>Cancelar</button><button class="btn pri" data-ok>${U.esc(okLabel)}</button>`);
    let done = false; const fin = v => { if (done) return; done = true; m.close(); res(v); };
    $("[data-no]", m.el).onclick = () => fin(input ? null : false);
    $("[data-ok]", m.el).onclick = () => fin(input ? $("#askIn", m.el).value : true);
    $("[data-x]", m.el).addEventListener("click", () => fin(input ? null : false));
    if (input) $("#askIn", m.el).onkeydown = e => { if (e.key === "Enter") $("[data-ok]", m.el).click(); };
  });
}

function rfmSeg(r, f) {
  if (f >= 4) return r <= 2 ? (f === 5 ? "naopode" : "risco") : r <= 4 ? "fieis" : "campeoes";
  if (f === 3) return r <= 2 ? "risco" : r === 3 ? "atencao" : "potencial";
  if (r === 1) return "perdidos";
  if (r === 2) return "hibernando";
  if (r === 3) return "dormentes";
  if (f === 2) return "potencial";
  return r === 4 ? "promessas" : "novos";
}

function quintile(list, val, prop) { // nota 1-5 por quintis da base (empates ficam juntos)
  const arr = list.map(c => [c, val(c)]).sort((a, b) => a[1] - b[1]); const n = arr.length; let i = 0;
  while (i < n) { let j = i; while (j + 1 < n && arr[j + 1][1] === arr[i][1]) j++; const sc = Math.min(5, Math.max(1, Math.ceil(((i + j) / 2 + 1) / n * 5))); for (let k = i; k <= j; k++) arr[k][0][prop] = sc; i = j + 1; }
}

async function sendCurrent() {

  if (S.attach) {

async function sendPayload(p) {

}

    $$(".prod", m.el).forEach(b => b.onclick = () => { picked.has(b.dataset.id) ? picked.delete(b.dataset.id) : picked.add(b.dataset.id); b.setAttribute("aria-pressed", picked.has(b.dataset.id)); $("#psend", m.el).disabled = !picked.size; $("#psel", m.el).textContent = picked.size ? picked.size + " selecionada(s)" : ""; });
  };
  const load = async q => { try { items = await API.catalog(q); draw(); } catch (e) { $("#plist", m.el).innerHTML = `<div class="empty tiny">Não consegui carregar o catálogo: ${U.esc(errMsg(e))}</div>`; } };
  $("#pq", m.el).oninput = U.debounce(e => load(e.target.value), 250);
  $("[data-x2]", m.el).onclick = m.close;
  $("#psend", m.el).onclick = async () => {
    const sel = items.filter(p => picked.has(p.id)); m.close();
    for (const p of sel) {
      const caption = `${p.nome}\nAtacado: ${U.brl(p.preco)}${p.url ? "\n" + p.url : ""}`;
      if (p.foto) await sendPayload({ kind: "media", media: { url: p.foto, mime: "image/jpeg", name: p.nome }, caption });

  };

}

/* enviar modelo (janela fechada ou nova conversa) */
async function openTemplateSend(c, isNew) {
  const lineId = c.line || (S.lines.find(l => l.status === "conectado") || {}).id;
  const m = modal(isNew ? "Começar conversa" : "Enviar modelo aprovado", `<div class="empty tiny">Carregando modelos…</div>`, `<span class="grow muted tiny" id="tcost" style="align-self:center"></span><button class="btn" data-x2>Cancelar</button><button class="btn pri" id="tsend" disabled>Enviar modelo</button>`, true);
  $("[data-x2]", m.el).onclick = m.close;
  let list = [];
  try { list = (await API.templates(lineId)).filter(t => t.status === "APPROVED"); } catch (e) { $(".mb", m.el).innerHTML = `<div class="empty">Não consegui carregar os modelos: ${U.esc(errMsg(e))}</div>`; return; }
  if (!list.length) { $(".mb", m.el).innerHTML = `<div class="empty"><h3>Nenhum modelo aprovado</h3><p>Crie um em Modelos. A Meta costuma aprovar em minutos.</p><a class="btn" href="#modelos">Ir para Modelos</a></div>`; return; }
  const ctx = ctxOf(c); const q = quizOf(c); const ship = ctx && ctx.sales.find(s => s.tracking_code);
  const auto = { primeiroNome: U.first(c.name), nome: c.name, rastreio: ship ? ship.tracking_code : "", etapa: quizStage(q), atendente: U.first(S.me.name) };
  $(".mb", m.el).innerHTML = `<div style="display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px" class="tgrid">
      <div><label class="f" for="tsel">Modelo</label><select id="tsel">${list.map((t, i) => `<option value="${i}">${U.esc(t.name)} · ${t.category === "UTILITY" ? "utilidade" : "marketing"}</option>`).join("")}</select><div id="tvars"></div>
      ${c.optOut ? `<div class="banner warn" style="margin:12px 0 0">Ela pediu para não receber disparos. Use só se ela tiver te pedido algo.</div>` : ""}</div>
      <div><label class="f">Prévia</label><div class="phone"><div class="m out"><div class="b" id="tprev"></div></div></div></div></div>`;
  if (matchMedia("(max-width:760px)").matches) $(".tgrid", m.el).style.gridTemplateColumns = "1fr";
  const draw = () => {
    const t = list[+$("#tsel", m.el).value]; const n = (t.body.match(/\{\{\d+\}\}/g) || []).length;
    const old = $$("[data-v]", m.el).map(x => x.value);
    $("#tvars", m.el).innerHTML = Array.from({ length: n }, (_, i) => { const key = (t.vars || [])[i]; const v = old[i] || auto[key] || ""; return `<label class="f">Variável {{${i + 1}}}${key ? ` · ${U.esc(key)}` : ""}</label><input type="text" data-v="${i}" value="${U.esc(v)}">`; }).join("");
    const upd = () => { const vals = $$("[data-v]", m.el).map(x => x.value); const txt = t.body.replace(/\{\{(\d+)\}\}/g, (k, d) => vals[d - 1] || k); $("#tprev", m.el).innerHTML = `<div class="tx">${U.esc(txt)}</div>${t.buttons ? `<div class="tbtns">${t.buttons.map(b => `<span>${U.esc(b)}</span>`).join("")}</div>` : ""}`; $("#tsend", m.el).disabled = vals.some(v => !v.trim()); $("#tcost", m.el).textContent = "Custo ≈ " + U.brl(t.category === "UTILITY" ? S.settings.precoUtilidade : S.settings.precoMarketing) + " (cobrado pela Meta)"; return txt; };
    $$("[data-v]", m.el).forEach(x => x.oninput = upd); upd();
  };
  $("#tsel", m.el).onchange = draw; draw();

  };
}

/* nova conversa */
function openNewConv() {
  const lines = S.lines.filter(l => l.status === "conectado");
  if (!lines.length) { toast("Conecte um número em Conexões primeiro"); location.hash = "#conexoes"; return; }
  const m = modal("Nova conversa", `<label class="f" for="nq">Cliente do sistema de vendas ou número</label><input type="text" id="nq" placeholder="Nome ou (22) 99999-9999" autocomplete="off"><div id="nsug" style="margin-top:6px"></div>
    <label class="f" for="nl">Enviar pelo número</label><select id="nl">${lines.map(l => `<option value="${U.esc(l.id)}">${U.esc(l.nome)} · ${U.esc(l.numero || "")}</option>`).join("")}</select>
    <p class="muted tiny">Para começar uma conversa a Meta exige um modelo aprovado. Se ela já conversa com você, abrimos a conversa existente.</p>`,
    `<button class="btn" data-x2>Cancelar</button><button class="btn pri" id="ngo" disabled>Continuar</button>`);
  $("[data-x2]", m.el).onclick = m.close;
  let pick = null;
  const people = Object.values(CTX.byKey).map(c => ({ name: c.name, tel: (c.sales[0].shipping_data || {}).tel || "" }));
  $("#nq", m.el).oninput = e => {
    const v = e.target.value.trim(); const n = U.norm(v); const d = U.digits(v);
    pick = d.length >= 10 ? { name: "", tel: d } : null;
    const hits = v.length >= 2 ? people.filter(p => U.norm(p.name).includes(n) || (d.length >= 4 && U.digits(p.tel).includes(d))).slice(0, 6) : [];
    $("#nsug", m.el).innerHTML = hits.map((p, i) => `<button class="btn sm" data-i="${i}" style="margin:0 6px 6px 0">${U.esc(p.name)} · ${U.esc(U.fmtPhone(p.tel))}</button>`).join("");
    $$("#nsug button", m.el).forEach(b => b.onclick = () => { pick = hits[+b.dataset.i]; $("#nq", m.el).value = pick.name + " · " + U.fmtPhone(pick.tel); $("#nsug", m.el).innerHTML = ""; $("#ngo", m.el).disabled = false; });
    $("#ngo", m.el).disabled = !pick;
  };
  $("#ngo", m.el).onclick = () => {
    const existing = S.convs.find(c => U.telKey(c.phone || c.id) === U.telKey(pick.tel));
    m.close();
    if (existing) { location.hash = "#conversas/" + encodeURIComponent(existing.id); if (windowLeft(existing) <= 0) setTimeout(() => openTemplateSend(existing), 200); return; }
    openTemplateSend({ id: U.toWa(pick.tel), phone: U.toWa(pick.tel), name: pick.name || U.fmtPhone(pick.tel), line: $("#nl", m.el).value, windowUntil: 0 }, true);
  };
}

const IND = { p: 30, de: "", ate: "", tab: "geral", q: "", sort: ["rec", -1], page: 0 };
const C_NOVO = "#2B78C4", C_REC = "#B07D2E";
const DAY = 864e5;
const isoDay = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function periodRange() {
  let start, end;
  if (IND.p === "custom" && IND.de && IND.ate) { start = new Date(IND.de + "T00:00:00").getTime(); end = new Date(IND.ate + "T23:59:59").getTime(); if (end < start) [start, end] = [new Date(IND.ate + "T00:00:00").getTime(), new Date(IND.de + "T23:59:59").getTime()]; }
  else { const p = IND.p === "custom" ? 30 : IND.p; end = Date.now(); start = end - p * DAY; }
  const len = end - start; return { start, end, pStart: start - len, days: Math.max(1, Math.round(len / DAY)) };
}
function periodLabel(R) { return IND.p === "custom" ? `${new Date(R.start).toLocaleDateString("pt-BR")} a ${new Date(R.end).toLocaleDateString("pt-BR")}` : `últimos ${R.days === 365 ? "12 meses" : R.days + " dias"}`; }
/* intervalos do gráfico: dia (até 35 dias), semana (até 120) ou mês do calendário */
function buckets(R, unit) {
  unit = unit || (R.days <= 35 ? "dia" : R.days <= 120 ? "semana" : "mes");
  const out = [];
  if (unit === "mes") {
    let d = new Date(R.start); d = new Date(d.getFullYear(), d.getMonth(), 1);
    while (d.getTime() <= R.end) { const s = Math.max(R.start, d.getTime()); const n = new Date(d.getFullYear(), d.getMonth() + 1, 1); const e = Math.min(R.end, n.getTime() - 1); out.push({ s, e, label: d.toLocaleDateString("pt-BR", { month: "short", year: "2-digit" }).replace(". de ", "/").replace(".", ""), full: d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" }) }); d = n; }
  } else {
    const step = unit === "dia" ? DAY : 7 * DAY; let s = R.start;
    while (s < R.end) { const e = Math.min(R.end, s + step - 1); const a = new Date(s), b = new Date(e); out.push({ s, e, label: (unit === "dia" ? a : b).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }), full: unit === "dia" ? a.toLocaleDateString("pt-BR") : `${a.toLocaleDateString("pt-BR")} a ${b.toLocaleDateString("pt-BR")}` }); s += step; }
  }
  return { unit, list: out };
}
const inB = (arr, b) => arr.filter(x => x.t >= b.s && x.t <= b.e);
const pctS = (x, y) => y ? Math.round(x / y * 100) + "%" : "—";
function deltaH(x, y) { if (!y || Math.abs(y) < 1) return `<span class="dl">sem base anterior</span>`; const d = (x - y) / Math.abs(y) * 100; if (Math.abs(d) > 999) return `<span class="dl">muito ${d > 0 ? "acima" : "abaixo"} do período anterior</span>`; const up = d >= 0; return `<span class="dl ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(d).toFixed(0)}%</span> <span class="dl">vs. período anterior</span>`; }
function deltaInv(x, y) { if (!y || Math.abs(y) < 1) return `<span class="dl">sem base anterior</span>`; const d = (x - y) / Math.abs(y) * 100; if (Math.abs(d) > 999) return `<span class="dl">muito ${d > 0 ? "acima" : "abaixo"} do período anterior</span>`; const up = d >= 0; return `<span class="dl ${up ? "down" : "up"}">${up ? "▲" : "▼"} ${Math.abs(d).toFixed(0)}%</span> <span class="dl">vs. período anterior</span>`; }
const kpiH = (l, v, d, sub) => `<div class="kpi"><small>${l}</small><b>${v}</b>${sub ? `<div class="ks">${sub}</div>` : ""}<div>${d || ""}</div></div>`;

    const multi = sel.length > 1 && sel[0] !== "colar";
    $("#cmix", m.el).innerHTML = multi ? `<label class="switch" style="margin-top:12px;max-width:520px"><span>Mensagem diferente para cada público</span><input type="checkbox" id="cpg" ${porGrupo ? "checked" : ""}></label>` : "";
    const cpg = $("#cpg", m.el); if (cpg) cpg.onchange = () => { porGrupo = cpg.checked; drawMsg(); upd(); };
    if (multi && porGrupo) {
      const ps = parts();
      box.innerHTML = `<div class="pergrp">${ps.map(p => `<div class="pg"><div class="pgh"><b>${U.esc(p.label)}</b><span class="muted tiny">${p.list.length} contato(s)</span></div><select data-tk="${U.esc(p.k)}" aria-label="Modelo para ${U.esc(p.label)}">${tplOpts(tplBy[p.k] != null ? tplBy[p.k] : 0)}</select><div class="phone mini"><div class="m out"><div class="b" data-pv="${U.esc(p.k)}">${prevHtml(tpls[tplBy[p.k] || 0])}</div></div></div></div>`).join("")}</div>`;
      $$("[data-tk]", box).forEach(sx => sx.onchange = () => { tplBy[sx.dataset.tk] = +sx.value; $(`[data-pv="${CSS.escape(sx.dataset.tk)}"]`, box).innerHTML = prevHtml(tpls[+sx.value]); upd(); });
    } else {
      const cur = $("#ct", m.el) ? $("#ct", m.el).value : 0;
      box.innerHTML = `<select id="ct">${tplOpts(cur)}</select><div class="phone" style="margin-top:8px;width:100%"><div class="m out"><div class="b" id="cprev">${prevHtml(tpls[+cur])}</div></div></div><p class="muted tiny">{{1}} vira o primeiro nome de cada cliente.</p>`;
      $("#ct", m.el).onchange = () => { $("#cprev", m.el).innerHTML = prevHtml(tpls[+$("#ct", m.el).value]); upd(); };
    }
  };
  const plan = () => { // [{label, list, tpl}]
    const ps = parts(); if (!tpls.length) return [];
    if (ps.length > 1 && porGrupo) return ps.map(p => Object.assign(p, { tpl: tpls[tplBy[p.k] || 0] }));
    const t = tpls[+($("#ct", m.el) || { value: 0 }).value]; const all = ps.flatMap(p => p.list);
    return [{ k: sel.join("+"), label: ps.map(p => p.label).join(" + "), list: all, tpl: t }];
  };
  const upd = () => {
    const pl = plan(); const n = pl.reduce((a, p) => a + p.list.length, 0); const cost = pl.reduce((a, p) => a + p.list.length * priceOf(p.tpl), 0);
    $("#ncost", m.el).innerHTML = n ? `<b>${n}</b> contatos${pl.length > 1 ? ` em ${pl.length} mensagens` : ""} · custo ≈ <b>${U.brl(cost)}</b>` : "Escolha o público";
    $("#ngo", m.el).disabled = !n || !tpls.length || !$("#cn", m.el).value.trim();
  };
  const setSel = k => {
    if (k === "colar") sel = sel[0] === "colar" ? [] : ["colar"];
    else { sel = sel.filter(x => x !== "colar"); sel.includes(k) ? sel = sel.filter(x => x !== k) : sel.push(k); }
    $$(".seg", m.el).forEach(x => x.setAttribute("aria-pressed", sel.includes(x.dataset.k)));
    $("#cpaste", m.el).classList.toggle("hide", sel[0] !== "colar");
    const cn = $("#cn", m.el); if (!cn.dataset.touched) cn.value = sel[0] === "colar" || !sel.length ? "" : (sel.length === 1 ? sets.find(s => s.k === sel[0]).label : sel.every(k => (sets.find(s => s.k === k) || {}).jor) ? "Jornada de compra" : sel.length === 2 ? sel.map(k => sets.find(s => s.k === k).label).join(" + ") : sel.length + " públicos") + " · " + new Date().toLocaleDateString("pt-BR", { month: "long" });
    drawMsg(); upd();
  };
  $$(".seg", m.el).forEach(b => b.onclick = () => setSel(b.dataset.k));
  $("#cpaste", m.el).oninput = e => { const blocked = new Set(S.convs.filter(c => c.optOut).map(c => U.telKey(c.id))); paste = [...new Set(e.target.value.split(/[\n,;]+/).map(U.digits).filter(d => d.length >= 10))].filter(d => !blocked.has(U.telKey(d))); upd(); };
  $("#cn", m.el).oninput = e => { e.target.dataset.touched = "1"; upd(); };
  $$("[name=cw]", m.el).forEach(r => r.onchange = () => $("#cwhen", m.el).classList.toggle("hide", r.value !== "agendar" || !r.checked));
  $("#ntest", m.el).onclick = async () => {
    const pl = plan(); if (!pl.length) return toast("Escolha o público e a mensagem");
    const n = await ask("Enviar teste", pl.length > 1 ? `Você recebe as ${pl.length} mensagens, uma de cada público.` : "O modelo chega no seu WhatsApp do jeito que a cliente vai ver.", "Enviar teste", "Seu WhatsApp com DDD");
    if (!n || U.digits(n).length < 10) return;
    if (DEMO) return toast("Teste enviado (demonstração)");
    const ts = [...new Map(pl.map(p => [p.tpl.name, p.tpl])).values()];
    try { for (const t of ts) await Real.call("waEnviar", { to: U.toWa(n), line: $("#cl", m.el).value, kind: "template", template: t.name, language: t.language, vars: ["Teste"], preview: t.body, teste: true }); toast("Teste enviado"); } catch (e) { toast(errMsg(e), 6000); }
  };
  $("#ngo", m.el).onclick = async () => {
    const pl = plan().filter(p => p.list.length); const n = pl.reduce((a, p) => a + p.list.length, 0); const cost = pl.reduce((a, p) => a + p.list.length * priceOf(p.tpl), 0);
    const resumo = pl.map(p => `• ${p.label}: ${p.list.length} → “${p.tpl.name}”`).join("\n");
    if (!await ask("Confirmar disparo", `${resumo}\n\nTotal: ${n} contatos · custo estimado ${U.brl(cost)}`, "Disparar")) return;
    const quando = $$("[name=cw]", m.el).find(r => r.checked).value === "agendar" ? new Date($("#cwhen", m.el).value).getTime() : null;
    if (quando !== null && !(quando > Date.now())) return toast("Escolha uma data futura");
    $("#ngo", m.el).disabled = true;
    const nome = $("#cn", m.el).value.trim();
    try {
      for (const p of pl) {
        const dest = p.list.map(x => ({ tel: U.toWa(x.tel), name: x.name }));
        await API.startCampaign({ nome: pl.length > 1 ? `${nome} · ${p.label}` : nome, modelo: p.tpl.name, language: p.tpl.language || "pt_BR", categoria: p.tpl.category, line: $("#cl", m.el).value, publico: p.k, total: dest.length, destinatarios: dest, agendarPara: quando, custoEstimado: dest.length * priceOf(p.tpl) });
      }
      m.close(); toast(pl.length > 1 ? `${pl.length} disparos ${quando ? "agendados" : "começaram"}` : quando ? "Disparo agendado" : "Disparo começou");
    } catch (e) { toast(errMsg(e), 6000); $("#ngo", m.el).disabled = false; }
  };
  drawMsg(); upd();
  if (preset && preset.list) setSel("preset");
  if (preset && preset.sel) preset.sel.forEach(k => sets.some(s => s.k === k) && setSel(k));
}

function drawQuick() {
  const box = $("#qList"); if (!box) return;
  box.innerHTML = S.quick.length ? `<table class="t"><tbody>${S.quick.map((q, i) => `<tr><td style="width:110px"><b>/${U.esc(q.atalho)}</b></td><td class="tiny">${U.esc(q.texto)}</td><td style="width:90px;text-align:right"><button class="btn sm ghost" data-e="${i}">Editar</button></td></tr>`).join("")}</tbody></table>` : `<div class="empty tiny">Nenhuma resposta rápida.</div>`;
  $$("[data-e]", box).forEach(b => b.onclick = () => editQuick(+b.dataset.e));
}
function editQuick(i) {
  const q = i >= 0 ? S.quick[i] : { atalho: "", texto: "" };
  const m = modal(i >= 0 ? "Editar resposta" : "Nova resposta rápida", `<label class="f" for="qa">Atalho (sem /)</label><input type="text" id="qa" value="${U.esc(q.atalho)}" placeholder="ex.: frete"><label class="f" for="qt">Texto</label><textarea id="qt" rows="5">${U.esc(q.texto)}</textarea>`, `${i >= 0 ? `<button class="btn danger" id="qdel">Excluir</button><span class="grow"></span>` : ""}<button class="btn" data-x2>Cancelar</button><button class="btn pri" id="qok">Salvar</button>`);
  $("[data-x2]", m.el).onclick = m.close;
  if (i >= 0) $("#qdel", m.el).onclick = async () => { const items = S.quick.filter((_, j) => j !== i); await API.saveQuick(items); m.close(); drawQuick(); };
  $("#qok", m.el).onclick = async () => {
    const a = $("#qa", m.el).value.trim().replace(/^\//, "").replace(/\s+/g, "-").toLowerCase(); const t = $("#qt", m.el).value.trim();
    if (!a || !t) return toast("Preencha atalho e texto");

    const items = S.quick.slice(); if (i >= 0) items[i] = { atalho: a, texto: t }; else items.push({ atalho: a, texto: t });
    try { await API.saveQuick(items); m.close(); drawQuick(); toast("Salvo"); } catch (e) { toast("Erro ao salvar: " + e.message); }

}

        <li>Quando perguntar, aceite <b>compartilhar o histórico de conversas</b>. Só dá para pedir isso uma vez, nas primeiras 24h.</li></ol>`
      : `<h3 style="margin-top:6px">Como conectar</h3>
        <div class="row" style="gap:16px;margin:8px 0"><label class="row" style="gap:5px"><input type="radio" name="via" value="meta" ${via === "meta" ? "checked" : ""}> Pela tela da Meta (recomendado)</label><label class="row" style="gap:5px"><input type="radio" name="via" value="manual" ${via === "manual" ? "checked" : ""}> Manual (token)</label></div>
        ${via === "manual" ? `<label class="f" for="mpn">Phone number ID</label><input type="text" id="mpn"><label class="f" for="mwb">WhatsApp Business Account ID</label><input type="text" id="mwb"><label class="f" for="mtk">Token permanente (usuário do sistema)</label><input type="password" id="mtk" autocomplete="off"><p class="muted tiny">O token vai direto para o servidor e não fica no navegador.</p>` : `<ol class="steps"><li>Use um número que <b>não</b> esteja em nenhum WhatsApp (ou apague a conta do app antes).</li><li>Na tela da Meta, crie ou escolha a conta do WhatsApp Business e confirme o número por SMS.</li></ol>`}`}
      ${!DEMO && via === "meta" && !(S.settings.metaAppId && S.settings.metaConfigId) ? `<div class="banner warn" style="margin:8px 0 0">Falta configurar o App ID e o Configuration ID da Meta (Conexões › Configurações).</div>` : ""}`;
    $$(".mode", m.el).forEach(b => b.onclick = () => { modo = b.dataset.m; if (modo === "hibrida") via = "meta"; draw(); });
    $$("[name=via]", m.el).forEach(r => r.onchange = () => { via = r.value; draw(); });
    $("#cgo", m.el).textContent = via === "manual" && modo === "oficial" ? "Conectar" : "Abrir tela da Meta";
  };
  draw();
  $("#cgo", m.el).onclick = async () => {
    const b = $("#cgo", m.el); b.disabled = true; b.textContent = "Conectando…";
    try {
      if (modo === "oficial" && via === "manual") {
        const pn = $("#mpn", m.el).value.trim(), wb = $("#mwb", m.el).value.trim(), tk = $("#mtk", m.el).value.trim();
        if (!pn || !wb || !tk) throw new Error("Preencha os três campos");
        await API.connect({ line: slot.id, nome: slot.nome, modo, via, phoneNumberId: pn, wabaId: wb, token: tk });
      } else if (DEMO) {
        await API.connect({ line: slot.id, nome: slot.nome, modo, via });
      } else {
        const r = await metaSignup(modo);
        await API.connect({ line: slot.id, nome: slot.nome, modo, via, code: r.code, phoneNumberId: r.phoneNumberId, wabaId: r.wabaId });
      }
      m.close(); toast(modo === "hibrida" ? "Conectado! Importando o histórico do celular…" : "Número conectado", 4000);
    } catch (e) { toast(errMsg(e), 7000); b.disabled = false; b.textContent = "Tentar de novo"; }
  };
}
/* Cadastro incorporado da Meta (Embedded Signup). featureType de coexistência = app WhatsApp Business existente. */
function loadFbSdk(appId) {
  return new Promise((res, rej) => {
    if (window.FB) return res(window.FB);
    window.fbAsyncInit = () => { FB.init({ appId, autoLogAppEvents: true, xfbml: false, version: GRAPH_VERSION }); res(FB); };
    const s = document.createElement("script"); s.src = "https://connect.facebook.net/pt_BR/sdk.js"; s.async = true; s.crossOrigin = "anonymous"; s.onerror = () => rej(new Error("Não consegui abrir o login da Meta (bloqueador de anúncios?)")); document.body.appendChild(s);
  });
}
async function metaSignup(modo) {
  const FB = await loadFbSdk(S.settings.metaAppId);
  return new Promise((resolve, reject) => {
    let info = {};
    const onMsg = ev => {
      if (!/facebook\.com$/.test(new URL(ev.origin).hostname)) return;
      try { const d = typeof ev.data === "string" ? JSON.parse(ev.data) : ev.data; if (d && d.type === "WA_EMBEDDED_SIGNUP") { if (/FINISH/.test(d.event)) info = { phoneNumberId: d.data.phone_number_id, wabaId: d.data.waba_id }; else if (d.event === "CANCEL") info.cancel = d.data && d.data.current_step; else if (d.event === "ERROR") info.error = d.data && d.data.error_message; } } catch (e) { }
    };
    addEventListener("message", onMsg);
    const extras = { setup: {}, sessionInfoVersion: "3" }; if (modo === "hibrida") extras.featureType = "whatsapp_business_app_onboarding";
    FB.login(resp => {
      setTimeout(() => { // a mensagem com os IDs pode chegar logo depois do callback
        removeEventListener("message", onMsg);
        if (!resp.authResponse || !resp.authResponse.code) return reject(new Error(info.error || (info.cancel ? "Conexão cancelada na Meta" : "A Meta não devolveu autorização")));
        if (!info.phoneNumberId) return reject(new Error("A Meta não informou o número conectado. Tente de novo."));
        resolve(Object.assign({ code: resp.authResponse.code }, info));
      }, 800);
    }, { config_id: S.settings.metaConfigId, response_type: "code", override_default_response_type: true, extras });
  });
}
